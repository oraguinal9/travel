services:
  travel-agent:
    build:
      context: .
      # NEXT_PUBLIC_* 在构建期内联，必须用 build-arg 传入（从 .env 读取）
      args:
        NEXT_PUBLIC_AMAP_JS_KEY: ${NEXT_PUBLIC_AMAP_JS_KEY}
        NEXT_PUBLIC_AMAP_JS_SECURITY: ${NEXT_PUBLIC_AMAP_JS_SECURITY}
    image: travel-agent:latest
    container_name: travel-agent
    restart: unless-stopped
    # 运行时环境变量（服务端 API Key 等）
    env_file:
      - .env
    # 仅暴露给本机 nginx 反代（3000 已被占用，改用 3100），不对外直接暴露
    ports:
      - "127.0.0.1:3100:3000"
