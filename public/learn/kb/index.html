<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>初二知识库 · 全科</title>
<style>
  :root{--bg:#f5f7fa;--panel:#fff;--text:#1f2933;--muted:#6b7280;--border:#e5e7eb;
    --accent:#2563eb;--accent-soft:#dbeafe;--code-bg:#f1f5f9;--pre-bg:#0f172a;--pre-text:#e2e8f0;--hl:#fde68a;--ok:#16a34a;--warn:#dc2626}
  [data-theme="dark"]{--bg:#0f172a;--panel:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--border:#334155;
    --accent:#60a5fa;--accent-soft:#1e3a8a;--code-bg:#334155;--pre-bg:#020617;--pre-text:#e2e8f0;--hl:#854d0e}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:15px;line-height:1.7}
  header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;
    background:var(--panel);border-bottom:1px solid var(--border)}
  header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);
    border-radius:10px;padding:6px 10px}
  .search input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:14px}
  .icon-btn{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;
    padding:6px 10px;cursor:pointer;font-size:14px}
  .icon-btn:hover{background:var(--accent-soft)}
  .hamburger{display:none}
  .layout{display:flex;min-height:calc(100vh - 53px)}
  nav{width:268px;flex:none;background:var(--panel);border-right:1px solid var(--border);
    overflow-y:auto;max-height:calc(100vh - 53px);position:sticky;top:53px}
  .group-title{font-weight:700;font-size:13px;color:var(--muted);padding:12px 16px 6px;
    cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between}
  .group-title:hover{color:var(--accent)}
  .group.collapsed .items{display:none}
  .item{padding:7px 16px 7px 28px;cursor:pointer;color:var(--text);border-left:3px solid transparent;font-size:14px}
  .item:hover{background:var(--accent-soft)}
  .item.active{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
  main{flex:1;padding:24px 32px;max-width:980px}
  #content h1,#content h2,#content h3,#content h4{line-height:1.35;margin-top:1.4em}
  #content h1{font-size:1.7em;border-bottom:2px solid var(--border);padding-bottom:.3em}
  #content h2{font-size:1.35em;border-bottom:1px solid var(--border);padding-bottom:.25em}
  #content h3{font-size:1.12em}
  #content a{color:var(--accent);text-decoration:none}
  #content ul,#content ol{padding-left:1.5em}
  #content li{margin:.25em 0}
  #content code{background:var(--code-bg);padding:.15em .4em;border-radius:5px;font-size:.9em;font-family:Consolas,monospace}
  #content pre{background:var(--pre-bg);color:var(--pre-text);padding:14px 16px;border-radius:10px;overflow-x:auto}
  #content pre code{background:transparent;color:inherit;padding:0}
  #content table{border-collapse:collapse;width:100%;margin:1em 0;font-size:14px}
  #content th,#content td{border:1px solid var(--border);padding:8px 10px;text-align:left}
  #content th{background:var(--accent-soft);font-weight:700}
  #content blockquote{margin:1em 0;padding:.6em 1em;background:var(--accent-soft);
    border-left:4px solid var(--accent);border-radius:0 8px 8px 0}
  .crumbs{color:var(--muted);font-size:13px;margin-bottom:6px}
  .results{margin-top:8px}
  .res-item{border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
  .res-item:hover{background:var(--accent-soft)}
  .res-group{color:var(--muted);font-size:12px;margin-bottom:2px}
  .res-title{font-weight:700}
  .res-snippet{font-size:13px;color:var(--muted);margin-top:2px}
  mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
  .app h2{border-bottom:1px solid var(--border);padding-bottom:.3em;margin-top:0}
  .form-row{margin:12px 0}
  .form-row label{display:block;font-weight:600;margin-bottom:4px;font-size:14px}
  .form-row input,.form-row select,.form-row textarea{width:100%;padding:9px 11px;border:1px solid var(--border);
    border-radius:9px;background:var(--bg);color:var(--text);font-size:14px;font-family:inherit}
  .form-row textarea{min-height:72px;resize:vertical}
  .pill-row{display:flex;flex-wrap:wrap;gap:8px}
  .pill{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;
    padding:6px 14px;cursor:pointer;font-size:13px;user-select:none}
  .pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer;font-weight:600}
  .btn.sec{background:var(--bg);color:var(--text);border:1px solid var(--border)}
  .btn.danger{background:var(--warn);color:#fff}
  .prob{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:12px 0;background:var(--panel)}
  .prob .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .tag{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 8px}
  .tag.reason{background:#fee2e2;color:var(--warn)}
  .tag.box{background:#dcfce7;color:var(--ok)}
  .prob .q{font-weight:600;margin:6px 0}
  .prob .a{color:var(--muted);font-size:14px;white-space:pre-wrap}
  .prob img{max-width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--border)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
  .stat{border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;background:var(--panel)}
  .stat .n{font-size:26px;font-weight:800;color:var(--accent)}
  .stat .l{font-size:13px;color:var(--muted);margin-top:2px}
  .bar{display:flex;align-items:center;gap:10px;margin:8px 0}
  .bar .name{width:80px;font-size:13px;color:var(--muted)}
  .bar .track{flex:1;background:var(--bg);border-radius:8px;height:14px;overflow:hidden;border:1px solid var(--border)}
  .bar .fill{height:100%;background:var(--accent)}
  .bar .val{width:40px;text-align:right;font-size:13px}
  .empty{color:var(--muted);text-align:center;padding:30px;border:1px dashed var(--border);border-radius:12px}
  .fab{position:fixed;right:20px;bottom:22px;z-index:25;width:54px;height:54px;border-radius:50%;
    background:var(--accent);color:#fff;border:0;font-size:24px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  #pinGate{position:fixed;inset:0;z-index:999;background:var(--bg);display:none;align-items:center;justify-content:center}
  #pinGate .box{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px 28px;width:300px;max-width:90vw;text-align:center}
  #pinGate h3{margin:0 0 6px}
  #pinGate p{color:var(--muted);font-size:13px;margin:0 0 16px}
  #pinGate input{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;font-size:18px;
    text-align:center;letter-spacing:6px;background:var(--bg);color:var(--text)}
  #pinGate .err{color:var(--warn);font-size:13px;min-height:18px;margin-top:8px}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  @media (max-width:820px){
    .hamburger{display:inline-block}
    nav{position:fixed;left:0;top:53px;bottom:0;transform:translateX(-100%);transition:.2s;z-index:20;box-shadow:2px 0 12px rgba(0,0,0,.12)}
    nav.open{transform:translateX(0)}
    main{padding:16px}
    .overlay{position:fixed;inset:53px 0 0 0;background:rgba(0,0,0,.35);z-index:15;display:none}
    .overlay.show{display:block}
  }
</style>
</head>
<body>
<div id="pinGate"><div class="box">
  <h3 id="pinTitle">知识库已上锁</h3>
  <p id="pinDesc">输入访问密码以进入（首次使用请设置 4 位数字密码）</p>
  <input id="pinInput" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off">
  <div class="err" id="pinErr"></div>
  <button class="btn" id="pinOk" style="width:100%;margin-top:6px">进入</button>
  <div class="hint" id="pinHint"></div>
</div></div>
<header>
  <button class="icon-btn hamburger" id="hamburger">☰</button>
  <h1>初二知识库 · 常州版</h1>
  <div class="search"><span>🔍</span><input id="searchInput" type="text" placeholder="搜索知识点 / 公式 / 错题…" autocomplete="off"></div>
  <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
</header>
<div class="layout">
  <div class="overlay" id="overlay"></div>
  <nav id="sidebar"></nav>
  <main><div id="content"><p style="color:var(--muted)">正在加载知识库…</p></main>
</div>
<footer>本地学习应用 · 数据存于本机浏览器 · 源 Markdown 在 html/src/</footer>
<button class="fab" id="fab" title="录入错题" style="display:none">＋</button>
<script>
const ALL_MD = {"src/00-学期规划/README.md": "# 学期规划（常州 · 初二）\n\n本文件夹存放常州版初二全年的目标、节奏与考试安排。\n\n## 初二关键节点\n- 上学期：适应新增物理（苏科版）；数学难度跃升（一次函数、四边形）\n- 下学期：生物+地理+信息科技 合格性考试（生地会考），等级呈现，作为毕业与升学参考\n- 中考（初三）：总分700，语数英各120、物100、化100、道法+历史各50、体育40\n\n## 使用建议\n1. 开学填学期目标/考试日历/作息计划\n2. 每月回看目标，调整节奏\n3. 会考科目从上学期就按会考标准准备\n", "src/00-学期规划/作息与计划.md": "# 作息与周计划（示例，按需调整）\n\n## 每日节奏\n- 放学后：先复习当日难点，再写作业\n- 21:30 前：错题录入 + 清单复习 15 分钟\n- 英语听说：每天 10 分钟（对应中考听说 30 分）\n- 周末：1 张知识树 + 1 套薄弱科专题\n\n## 周计划表\n| 日 | 重点 |\n|---|---|\n| 一 | |\n| 二 | |\n| 三 | 英语听说 |\n| 四 | |\n| 五 | 体育训练 |\n| 六 | 复盘+专题+生地会考预热 |\n| 日 | 预习+休息 |\n\n> 注：生物/地理从初二上学期起按会考标准准备；体育平时成绩计入中考，需持续训练。\n", "src/00-学期规划/作息计划.md": "# 每日作息计划（模板）\n\n| 时段 | 安排 | 要点 |\n|---|---|---|\n| 6:30-7:00 | 起床+晨读 | 英语单词/古文 |\n| 放学后 | 先复习后作业 | 错题当天入册 |\n| 19:30-20:30 | 薄弱科专项 | 按错题本靶向 |\n| 21:00-21:30 | 今日复习 | 间隔重复刷错题 |\n| 22:00 | 睡觉 | 保证睡眠 |\n\n> 数学/物理/化学中考不带计算器，平时练习硬算。\n", "src/00-学期规划/学期目标.md": "# 学期目标（和孩子一起定，写具体可量化）\n\n## 常州中考总分结构（目标参考，满分 700）\n| 科目 | 分值 |\n|---|---|\n| 语文 | 120 |\n| 数学 | 120 |\n| 英语 | 120（笔试90+听说30） |\n| 物理 | 100 |\n| 化学 | 100（初三） |\n| 道德与法治 | 50（开卷） |\n| 历史 | 50（开卷） |\n| 体育 | 40 |\n\n## 分科目标（初二阶段）\n| 科目 | 当前 | 目标 | 关键动作 |\n|---|---|---|---|\n| 语文 | | | |\n| 数学 | | | |\n| 英语 | | | 听说每天练 |\n| 物理 | | | 新学科起跑 |\n| 生物(会考) | | 合格+冲A | 识图+真题 |\n| 地理(会考) | | 合格+冲A | 画图+真题 |\n| 历史 | | | 时间轴 |\n| 道法 | | | 建索引 |\n| 体育 | | | 周记录 |\n\n## 月度里程碑\n- 9 月：适应物理(苏科版)，建立错题本习惯\n- 12 月：生地会考首轮复习启动\n- 初二下学期：生物/地理/信息科技会考冲刺\n- 期末：全科知识树复盘\n", "src/00-学期规划/常州中考与教材说明.md": "# 常州中考与教材版本说明（初二适用）\n\n> 本知识库按**江苏省常州市**初中教学与中考政策定制。政策以常州市教育局当年公布为准，此处供规划参考。\n\n## 一、各科教材版本（常州初中）\n\n| 学科 | 教材版本 |\n|---|---|\n| 语文 | 人教版（部编版） |\n| 数学 | 苏科版 |\n| 英语 | 译林版（牛津） |\n| 物理 | 苏科版 |\n| 生物 | 苏教版 |\n| 地理 | 人教版 |\n| 历史 | 人教版（部编版） |\n| 道德与法治 | 人教版（部编版） |\n| 化学 | 沪教版（**初三**开始，初二不涉及） |\n| 体育 | 无统一教材 |\n\n## 二、常州中考（2025 政策）总分 700 分\n\n| 科目 | 分值 | 说明 |\n|---|---|---|\n| 语文 | 120 | 全市统一命题 |\n| 数学 | 120 | **不得带计算器** |\n| 英语 | 120 | 笔试 90 + 听力口语 30（自动化考试） |\n| 物理 | 100 | **不得带计算器** |\n| 化学 | 100 | 初三，**不得带计算器** |\n| 道德与法治 | 50 | 与历史合卷，**开卷** |\n| 历史 | 50 | 与道法合卷，**开卷** |\n| 体育 | 40 | 平时 + 现场测试 |\n\n- 中考时间：6 月中下旬（2025 年为 6 月 18–20 日）。\n- 数学、物理、化学考试均**不得携带计算器**。\n\n## 三、⭐ 生地会考（初二特有，务必重视）\n\n- **八年级学年末**实施 **生物、地理、信息科技** 三门学科**合格性考试（会考）**。\n- 成绩以**等级**呈现，作为初中毕业和高级中等学校招生的**参考依据**（不直接计入 700 分总分，但须合格）。\n- 生物、地理文件夹需从初二上学期就按会考标准准备，下学期集中突破。\n\n## 四、九年级下学期其他考查\n\n- 物理、化学、生物**实验操作能力考查** + **艺术素质测评**，等级呈现。\n", "src/00-学期规划/考试日历.md": "# 考试日历（常州，自行补充具体日期）\n\n| 时间 | 考试/事件 | 备注 |\n|---|---|---|\n| 每月 | 月考 | 考后必录错题 |\n| 期中 | 期中考试 | 全科复盘 |\n| 初二下学期末 | 生物会考 | 合格性考试，等级呈现 |\n| 初二下学期末 | 地理会考 | 合格性考试，等级呈现 |\n| 初二下学期末 | 信息科技会考 | 合格性考试，等级呈现 |\n| 期末 | 期末考试 | 学年收官 |\n| 次年 6 月中下旬 | 中考 | 总分 700，语数英各120/物100/化100/道法历史各50/体育40 |\n", "src/01-语文/README.md": "# 语文（常州版）\n\n> 教材版本：**人教版（部编版）**\n\n## 初二学习重点（按常州教学进度）\n- 文言文：八上《三峡》《答谢中书书》《孟子》三章等，八下《桃花源记》《小石潭记》等，实词/虚词/句式系统整理\n- 古诗文默写：课标 61 篇中初二部分，必须零失误\n- 名著阅读：八上《红星照耀中国》《昆虫记》，八下《经典常谈》《钢铁是怎样炼成的》\n- 阅读：散文/小说/说明文题型；作文从记叙文向议论文过渡\n\n## 与常州中考/会考的关联\n- 语文 120 分（中考全市统一命题），作文分值大，是拉分关键。\n\n## 本文件夹放什么\n- `README.md`（本说明）\n- `错题本.md`（按模板录入，重中之重）\n- `一页纸清单.md`（公式/词汇/核心结论速查）\n- 知识笔记：新建 `笔记-主题.md`，用「模板/知识笔记模板」\n\n## 提分建议\n- 每周整理 1 篇文言文书下注释 + 翻译\n- 建「作文素材本」：人物/名言/时事/开头结尾各一类\n- 阅读按题型（作用题/含义题/赏析题）总结答题公式\n", "src/01-语文/一页纸清单-上学期.md": "# 语文 · 一页纸清单（上学期）\n\n> 八上（人教版·部编版）。文言与默写是底线分，名著抓人物与脉络。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 《三峡》《答谢中书书》《记承天寺夜游》 | 写景小品：背默+翻译+情感 |\n| 《孟子》三章（得道多助…） | 议论性文言：论点—论据—论证 |\n| 《愚公移山》 | 寓言：实词'惩/匮/彻'，古今异义 |\n| 唐诗五首 | 野望/黄鹤楼/使至塞上/渡荆门/钱塘湖春行 |\n| 名著《红星照耀中国》 | 斯诺纪实，人物+长征+延安 |\n| 名著《昆虫记》 | 法布尔科普，观察+科学精神 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 文言虚词 之/其/而/以 | 之：代词/助词(的)/取独；以：凭/因/目的 | 不看语境硬套 |\n| 古诗文默写高频 | 三峡、答谢中书书、孟子三章 | 只背不写，错字(曦/颓/鳞) |\n| 写景散文作用题 | 内容+结构(铺垫/照应)+情感 | 漏结构只写内容 |\n| 名著《红星照耀中国》 | 作者斯诺，记录延安与长征 | 与'小说'混淆 |\n| 病句与标点基础 | 顿号<逗号<分号 层级 | 标点层级错 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 之(助词'的') / 之(取独) | 取独时取消句子独立性，不译 |  |\n| 借景抒情 / 托物言志 | 前者写景抒情，后者借物喻理 |  |\n\n## 待补充\n\n- 每周默写 1 次并订正错字\n- 整理文言实词卡(每课书下注释)\n- 建作文素材本：人物/名言/开头结尾\n", "src/01-语文/一页纸清单-下学期.md": "# 语文 · 一页纸清单（下学期）\n\n> 八下（人教版·部编版）。宋文名篇+诗经六义，议论文初步入门。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 《桃花源记》《小石潭记》 | 记体文言：'异'在情感 |\n| 《庄子》二则 /《礼记》二则 /《马说》 | 诸子+韩愈，议论说理 |\n| 《岳阳楼记》《醉翁亭记》 | 宋文名篇：情景交融 |\n| 《诗经》二首（关雎/蒹葭） | 风雅颂(内容)+赋比兴(手法) |\n| 名著《经典常谈》 | 朱自清，十三经常识入门 |\n| 名著《钢铁是怎样炼成的》 | 奥斯特洛夫斯基，保尔四次死里逃生 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 诗经六义 | 风雅颂为内容，赋比兴为手法 | 内容与手法混淆 |\n| 记体文'情感' | 小石潭记'凄神寒骨'的孤寂 | 只译不品情 |\n| 议论文三要素(初步) | 论点/论据/论证 | 与记叙文写法混 |\n| 名著《钢铁》 | 保尔·柯察金，作者苏联 | 作者国籍错 |\n| 古诗默写 | 茅屋/卖炭翁/关雎/蒹葭 | 雎/蒹葭字形易错 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 赋 / 比 / 兴 | 赋：直陈；比：比喻；兴：起兴联想 |  |\n| 记(叙事)/说(议论)/铭(警戒) | 文体不同，写法不同 |  |\n\n## 待补充\n\n- 议论文入门：找论点、辨论据\n- 练演讲稿/读后感\n- 文言实词总表(八上+八下)\n", "src/01-语文/核心知识.md": "# 语文 · 核心知识卡（第一批种子，按常州初二进度）\n\n> 这是预置的真实知识，可直接复习，也随时往里补新卡片。配合 `错题本.md` 和 `一页纸清单.md` 使用。\n\n---\n\n## 知识卡 1：文言文实词与虚词\n\n**核心概念**：初二文言文比重上升，先拿下高频虚词和古今异义。\n\n**关键要点**\n1. 虚词「之」：作代词/助词(的)/取消句子独立性，需看语境\n1. 虚词「其」：多作代词(他/它的)；「而」表顺承/转折/修饰\n1. 虚词「以」：表凭(用)、表因(因为)、表目的(来)\n1. 古今异义：'走'=跑，'汤'=热水，'妻子'=妻和子\n\n**易错提醒**：把虚词意思硬套，不看句子成分；建议每课整理书下注释成表。\n\n**典型例题**：译「属予作文以记之」：'以'表目的=来；'之'代这件事。\n\n**关联**：见 古诗文默写卡、作文结构卡\n\n---\n\n## 知识卡 2：古诗文默写高频句\n\n**核心概念**：课标 61 篇中初二篇目，默写零失误是底线分。\n\n**关键要点**\n1. 八上：《三峡》《答谢中书书》《孟子》三章(得道多助等)\n1. 八下：《桃花源记》《小石潭记》《诗经》二首(关雎/蒹葭)\n1. 易错字：'阙'、'曦'、'髫'、'翕忽' 等需动手写熟\n\n**易错提醒**：只背不写，考试写错字；每周默写 1 次，错字单独练。\n\n**典型例题**：默写「俶尔远逝，往来翕忽」——注意'翕'不写成'吸'。\n\n**关联**：配合 艾宾浩斯复习表 循环\n\n---\n\n## 知识卡 3：阅读赏析题答题公式\n\n**核心概念**：散文/小说/说明文都有套路，按题型套公式。\n\n**关键要点**\n1. 作用题(句子/段)：内容+结构(承上启下/铺垫/照应)+情感\n1. 含义题：表层义+深层义(比喻/象征/主旨)\n1. 赏析题：手法(修辞/描写)+内容+效果+情感\n1. 说明文：说明方法(举例子/列数字)+作用\n\n**易错提醒**：答'作用'只写内容忘了结构；先辨题型再套公式。\n\n**典型例题**：问'开头环境描写作用'→ 交代背景+渲染气氛+铺垫下文。\n\n---\n\n## 知识卡 4：作文：记叙文结构\n\n**核心概念**：初二作文仍以记叙文为主，结构清晰比辞藻重要。\n\n**关键要点**\n1. 开头：点题/设悬念，≤3 行\n1. 中间：一件事写深，有细节(动作/心理/环境)\n1. 结尾：升华(感悟/道理)，回扣开头\n1. 素材本分类：人物/名言/时事/开头结尾\n\n**易错提醒**：事例堆砌无重点；一件事写透胜过三件流水账。\n\n**典型例题**：题目《那一瞬间》→ 聚焦一个动作细节+心理变化+感悟。\n\n**关联**：见 模板/知识笔记模板\n\n---\n\n", "src/01-语文/错题本.md": "# 语文 · 错题本\n\n> 复制下面的「题块」追加新题。标签用于筛选同类错因。\n\n---\n\n### 题 1\n- **日期**：\n- **来源**：（月考/作业/练习）\n- **知识点标签**：\n- **错因**：（计算错/概念错/审题错/方法错/其他）\n- **原题**：（粘贴或截图，截图放同目录 `图/` 文件夹）\n- **我的错误答案**：\n- **正确解法**：\n- **反思 / 同类题**：\n- **重做记录**：（日期-对错）\n\n---\n", "src/02-数学/README.md": "# 数学（常州版）\n\n> 教材版本：**苏科版**\n\n## 初二学习重点（按常州教学进度）\n- 八上：轴对称图形、勾股定理、实数、平面直角坐标系、一次函数、二元一次方程组\n- 八下：中心对称图形（平行四边形）、分式、反比例函数、二次根式\n- 函数（一次/反比例）与几何（四边形）是初二两大核心，难度明显跃升\n\n## 与常州中考/会考的关联\n- 数学 120 分，**中考不得带计算器** → 平时计算必须过硬，不能依赖验算工具。\n\n## 本文件夹放什么\n- `README.md`（本说明）\n- `错题本.md`（按模板录入，重中之重）\n- `一页纸清单.md`（公式/词汇/核心结论速查）\n- 知识笔记：新建 `笔记-主题.md`，用「模板/知识笔记模板」\n\n## 提分建议\n- 函数图像题务必动手画图，数形结合\n- 几何证明建立「条件→结论」推导链\n- 错题本重点标「计算错/辅助线错/概念错」\n", "src/02-数学/一页纸清单-上学期.md": "# 数学 · 一页纸清单（上学期）\n\n> 八上（苏科版）。函数与几何起飞，数形结合是主线。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 轴对称图形 | 轴对称/垂直平分线/角平分线性质 |\n| 勾股定理 | a²+b²=c²，仅直角三角形 |\n| 实数 | 平方根/立方根/无理数 |\n| 平面直角坐标系 | 点/象限/距离公式 |\n| 一次函数 | y=kx+b 图像与性质 |\n| 二元一次方程组 | 代入消元/加减消元 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 勾股定理 | a²+b²=c²，c 为斜边 | 斜边当直角边代入 |\n| 实数运算 | √a(a≥0)；√a²=|a| | 漏绝对值(a 可能负) |\n| 平面直角坐标 | 点(a,b)，象限符号看正负 | 横纵坐标写反 |\n| 一次函数 | k>0 升、k<0 降；b 是 y 截距 | k=0 不是一次函数 |\n| 方程组消元 | 代入或加减，化成一元 | 消元不彻底 |\n| 轴对称性质 | 对应点连线被对称轴垂直平分 | 对称轴画错 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 正比例 y=kx / 一次 y=kx+b | b=0 时为正比例 |  |\n| 代入消元 / 加减消元 | 看系数选省力的方法 |  |\n\n## 待补充\n\n- 函数图像务必动手画\n- 几何证明建'条件→结论'链\n- 错题标注 计算错/辅助线错/概念错\n", "src/02-数学/一页纸清单-下学期.md": "# 数学 · 一页纸清单（下学期）\n\n> 八下（苏科版）。四边形大章+分式+反比例+二次根式，难度明显跃升。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 中心对称图形·平行四边形 | 平行四边形/菱形/矩形/正方形 |\n| 分式 | 乘除/加减/分式方程 |\n| 反比例函数 | y=k/x 图像与性质 |\n| 二次根式 | √a 性质与化简 |\n| 数据的离散程度 | 方差 s² |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 平行四边形判定 | 对边平行/相等，或对角线互相平分 | 与特殊四边形混 |\n| 菱形/矩形/正方形 | 菱形重'边'，矩形重'角' | 特殊关系乱 |\n| 分式运算 | 先因式分解再约分 | 直接通分错 |\n| 反比例函数 | k>0 一三象限；k=xy | 漏'每一象限内'前提 |\n| 二次根式 | √(a²)=|a|；(√a)²=a(a≥0) | 漏 a≥0 条件 |\n| 方差 | s²=1/n·Σ(xi−x̄)²，越大越波动 | 先算平均数 x̄ |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 矩形 / 菱形 | 矩形重角，菱形重边 |  |\n| 分式 / 分数 | 分母含字母，须验根 |  |\n\n## 待补充\n\n- 四边形'家族树'一张图\n- 分式方程必须验根\n- 几何证明链+辅助线本\n", "src/02-数学/核心知识.md": "# 数学 · 核心知识卡（第一批种子，按常州初二进度）\n\n> 这是预置的真实知识，可直接复习，也随时往里补新卡片。配合 `错题本.md` 和 `一页纸清单.md` 使用。\n\n---\n\n## 知识卡 1：勾股定理\n\n**核心概念**：直角三角形中三边关系的核心定理，初二几何基石。\n\n**关键要点**\n1. 内容：a²+b²=c²，c 为斜边（直角所对边）\n1. 逆定理：若 a²+b²=c² 则三角形为直角三角形（判定直角）\n1. 应用：求边长、证明直角、实际距离(构造直角三角形)\n\n**易错提醒**：把斜边当直角边代入；逆定理忘了'先找最长边'。\n\n**典型例题**：直角边 3、4，则斜边=√(3²+4²)=5。\n\n**关联**：见 错题本.md 题1(一次函数)\n\n---\n\n## 知识卡 2：一次函数 y=kx+b\n\n**核心概念**：初二函数主线，数形结合的典型。\n\n**关键要点**\n1. k 决定增减：k>0 上升，k<0 下降；|k| 越大越陡\n1. b 是 y 轴截距（与 y 轴交点 (0,b)）\n1. 待定系数法：已知两点代入求 k、b\n1. k=0 时不是一次函数（是常函数）\n\n**易错提醒**：代入坐标写反横纵坐标；负号不带着走(见错题本范例)。\n\n**典型例题**：过(2,5)(-1,-1)→ 解得 y=2x+1。\n\n**关联**：见 一页纸清单.md\n\n---\n\n## 知识卡 3：平行四边形性质与判定\n\n**核心概念**：中心对称图形，四边形大章的基础。\n\n**关键要点**\n1. 性质：对边平行且相等、对角相等、对角线互相平分\n1. 判定：两组对边平行/相等，或一组对边平行且相等，或对角线互相平分\n1. 特殊：菱形(邻边等/对角线垂直)、矩形(一直角/对角线相等)、正方形\n\n**易错提醒**：判定条件记混（'两组对角相等'不能单独判定）；与菱形矩形区分。\n\n**典型例题**：已知 ABCD 对角线互相平分→ 是平行四边形。\n\n---\n\n## 知识卡 4：二次根式\n\n**核心概念**：苏科版八下内容，运算易错点集中。\n\n**关键要点**\n1. √a 有意义 ⇒ a≥0\n1. 性质：√(a²)=|a|；(√a)²=a(a≥0)\n1. 化简：提完全平方因子；加减先化为最简二次根式\n\n**易错提醒**：√(a²)=a 漏绝对值（a 可能为负）；√a·√b=√(ab) 需 a,b≥0。\n\n**典型例题**：√((-3)²)=|-3|=3。\n\n---\n\n## 知识卡 5：反比例函数 y=k/x\n\n**核心概念**：与一次函数并列的函数第二条线。\n\n**关键要点**\n1. k>0 图像在一三象限，k<0 在二四象限\n1. 性质：每个象限内，k>0 时 y 随 x 增大而减小\n1. k=xy（过图像上点满足 xy=k）\n\n**易错提醒**：忽略'每个象限内'前提；k 符号与象限对应错。\n\n**典型例题**：过(2,3)的反比例函数：k=6→ y=6/x。\n\n---\n\n", "src/02-数学/错题本.md": "# 数学 · 错题本\n\n> 复制下面的「题块」追加新题。标签用于筛选同类错因。\n\n---\n\n### 题 1（✅ 示例：照这个格式填）\n- **日期**：2026-09-15\n- **来源**：月考\n- **知识点标签**：一次函数-求解析式\n- **错因**：计算错（代入点 (-1,-1) 时，把纵坐标 -1 抄成了 +1）\n- **原题**：已知一次函数 y = kx + b 的图像经过点 (2, 5) 和 (-1, -1)，求这个一次函数解析式。\n- **我的错误答案**：y = (4/3)x + 7/3\n- **正确解法**：\n  代入两点得方程组：\n  2k + b = 5   …①\n  -k + b = -1  …②\n  ① − ②：3k = 6 → k = 2\n  代入②：−2 + b = −1 → b = 1\n  所以 **y = 2x + 1**\n- **反思 / 同类题**：代入坐标时\"横坐标→x，纵坐标→y\"别写反；负号要带着走。同类题：已知图像与坐标轴交点求解析式。\n- **重做记录**：2026-09-20 对 ✓ ｜ 2026-09-27 对 ✓\n\n---\n\n### 题 2（⬇️ 复制这一整块，往后接着填）\n- **日期**：\n- **来源**：（月考/作业/练习）\n- **知识点标签**：\n- **错因**：（计算错/概念错/审题错/方法错/其他）\n- **原题**：（粘贴或截图，截图放同目录 `图/` 文件夹）\n- **我的错误答案**：\n- **正确解法**：\n- **反思 / 同类题**：\n- **重做记录**：（日期-对错）\n\n---\n", "src/03-英语/README.md": "# 英语（常州版）\n\n> 教材版本：**译林版（牛津）**\n\n## 初二学习重点（按常州教学进度）\n- 译林版 8A / 8B，词汇量大幅上升\n- 时态深化：一般现在/过去/将来 + 现在完成时；被动语态初步\n- 从句入门：宾语从句、状语从句\n- 阅读/完形/写作分值大\n\n## 与常州中考/会考的关联\n- 英语 120 分 = 笔试 90 + **听力口语 30**（听说自动化考试）→ 平时要练听力和口语，不能只刷题。\n\n## 本文件夹放什么\n- `README.md`（本说明）\n- `错题本.md`（按模板录入，重中之重）\n- `一页纸清单.md`（公式/词汇/核心结论速查）\n- 知识笔记：新建 `笔记-主题.md`，用「模板/知识笔记模板」\n\n## 提分建议\n- 用「单词本」按单元 + 考频分类，配例句记忆\n- 语法用思维导图梳时态与从句\n- 每周 1 篇写作并请老师批改后存入错题本\n", "src/03-英语/一页纸清单-上学期.md": "# 英语 · 一页纸清单（上学期）\n\n> 译林版 8A。时态深化与基础从句入门，听说每天练。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| Unit1-4 基础 | 比较级/最高级，一般过去时 |\n| Unit5-8 提升 | if 条件句，动词不定式，现在完成时初步 |\n| 8A 核心词汇与词组 | 按单元+考频分类记忆 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 一般过去时 | 动词过去式(规则/不规则) | 不规则动词错 |\n| 现在完成时(初步) | have/has+done，强调影响/经历 | 与过去时混用 |\n| 比较级最高级 | er/est 或 more/most | 双写/变 y 错 |\n| if 条件句 | 主将从现 | 时态错配 |\n| 动词不定式 | to do 作宾语/目的 | 漏 to 或误加 |\n| 高频词组 | take part in / be interested in | 介词后接 doing |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 现在完成 / 一般过去 | 完成强调影响/经历；过去指过去 |  |\n| 形容词原级 / 比较级 | 两者相比用比较级 |  |\n\n## 待补充\n\n- 背不规则动词表\n- 听说每天 10 分钟(对应中考 30 分)\n- 每周 1 篇写作请老师改\n", "src/03-英语/一页纸清单-下学期.md": "# 英语 · 一页纸清单（下学期）\n\n> 译林版 8B。被动语态与三大从句是中考笔试主场。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 被动语态 | am/is/are+过去分词 |\n| 宾语从句 | 语序/引导词/时态 |\n| 状语从句 | 时间/条件/原因 |\n| used to / 现在完成延续 | 过去习惯 vs 持续 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 被动语态 | be+过去分词；by 执行者可省 | 漏 be 动词(主动被动混) |\n| 宾语从句 | 陈述语序；that/if,whether/what | 写成疑问语序 |\n| 状语从句 | when/if/because 引导 | 主将从现忘用 |\n| used to | 过去常做(现在不) | 与现在完成混 |\n| 介词辨析 | in/on/at；for/since | 时间介词错 |\n| 冠词 | a/an/the 特指泛指 | 漏 the 或多余 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 主动 / 被动 | 主语是承受者用被动 |  |\n| if(是否) / if(如果) | 词义不同，时态不同 |  |\n\n## 待补充\n\n- 从句用思维导图梳理\n- 写作请老师批改后入错题本\n- 中考听说冲刺训练\n", "src/03-英语/核心知识.md": "# 英语 · 核心知识卡（第一批种子，按常州初二进度）\n\n> 这是预置的真实知识，可直接复习，也随时往里补新卡片。配合 `错题本.md` 和 `一页纸清单.md` 使用。\n\n---\n\n## 知识卡 1：四大时态速查\n\n**核心概念**：译林版 8A/8B 核心时态，中考笔试主场。\n\n**关键要点**\n1. 一般现在：often/usually，主语三单动词加 s\n1. 一般过去：yesterday/last，动词用过去式\n1. 一般将来：tomorrow/will/be going to\n1. 现在完成：already/yet/ever，have/has + done，强调影响\n\n**易错提醒**：现在完成时与过去时混用；三单忘加 s。\n\n**典型例题**：I have finished my homework (already).\n\n**关联**：见 宾语从句卡\n\n---\n\n## 知识卡 2：宾语从句\n\n**核心概念**：连词、语序、时态三件事。\n\n**关键要点**\n1. 语序：陈述句语序（主语在前）\n1. 引导词：that(无意义)/if,whether(是否)/what,who 等\n1. 时态：主现从任；主过从过；客观真理用一般现在\n\n**易错提醒**：语序写成疑问语序；'是否'用 if/whether 而非 that。\n\n**典型例题**：He said (that) he was tired. / I don't know if it will rain.\n\n---\n\n## 知识卡 3：被动语态初步\n\n**核心概念**：8B 初步接触，中考常考。\n\n**关键要点**\n1. 结构：am/is/are + 过去分词（现在时）\n1. 主语是动作承受者时用被动\n1. by + 执行者 可省略\n\n**易错提醒**：漏 be 动词（主动被动混淆）；过去分词写错。\n\n**典型例题**：The book is written by Lu Xun.\n\n---\n\n## 知识卡 4：高频词组(8A/8B)\n\n**核心概念**：写作与完形靠积累。\n\n**关键要点**\n1. take part in 参加 / pay attention to 注意\n1. be interested in 对…感兴趣 / make progress 取得进步\n1. depend on 依赖 / look forward to 期待(to 为介词)\n\n**易错提醒**：look forward to 后接 doing 而非 do；介词词组后接 ing。\n\n**典型例题**：I look forward to hearing from you.\n\n---\n\n", "src/03-英语/错题本.md": "# 英语 · 错题本\n\n> 复制下面的「题块」追加新题。标签用于筛选同类错因。\n\n---\n\n### 题 1\n- **日期**：\n- **来源**：（月考/作业/练习）\n- **知识点标签**：\n- **错因**：（计算错/概念错/审题错/方法错/其他）\n- **原题**：（粘贴或截图，截图放同目录 `图/` 文件夹）\n- **我的错误答案**：\n- **正确解法**：\n- **反思 / 同类题**：\n- **重做记录**：（日期-对错）\n\n---\n", "src/04-物理/README.md": "# 物理（初二新学科）（常州版）\n\n> 教材版本：**苏科版**\n\n## 初二学习重点（按常州教学进度）\n- 八上：声现象、物态变化、光现象、光的折射、凸透镜成像、物体的运动\n- 八下：物质的物理属性、力、力与运动、压强、浮力、简单机械和功\n- 实验探究题占比高，重视实验原理与图像\n\n## 与常州中考/会考的关联\n- 物理 100 分（中考），**不得带计算器**；是新学科，初二起跑别掉队。\n\n## 本文件夹放什么\n- `README.md`（本说明）\n- `错题本.md`（按模板录入，重中之重）\n- `一页纸清单.md`（公式/词汇/核心结论速查）\n- 知识笔记：新建 `笔记-主题.md`，用「模板/知识笔记模板」\n\n## 提分建议\n- 物理重「建模」：把生活现象抽象成受力图\n- 每个实验记「目的-器材-步骤-结论-误差」五要素\n- 公式先理解物理量含义再记忆，配单位训练\n", "src/04-物理/一页纸清单-上学期.md": "# 物理 · 一页纸清单（上学期）\n\n> 八上（苏科版）。初二新学科，重实验与建模，起跑别掉队。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 声现象 | 音调/响度/音色，噪声控制 |\n| 物态变化 | 熔化凝固/汽化液化/升华凝华 |\n| 光现象 | 反射/平面镜成像 |\n| 光的折射 | 折射规律 |\n| 凸透镜成像 | u 与 f 的关系 |\n| 物体的运动 | v=s/t |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 声三要素 | 音调(频率)/响度(振幅)/音色 | 音调响度混 |\n| 物态变化 | 熔/汽/升吸热；凝/液/凝放热 | 吸放热方向错 |\n| 平面镜成像 | 等大/等距/虚像/垂直 | 虚实不分 |\n| 凸透镜成像 | u>2f 缩，f<u<2f 放，u<f 虚 | 区间记混 |\n| 速度 | v=s/t；1m/s=3.6km/h | 单位不统一就代入 |\n| 反射定律 | 三线共面，反射角=入射角 | 把'入射角'当下 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 音调 / 响度 | 音调看频率，响度看振幅 |  |\n| 实像 / 虚像 | 实像屏可接，虚像不可 |  |\n\n## 待补充\n\n- 凸透镜口诀：一倍焦距分虚实，二倍焦距分大小\n- 每个实验记'目的-器材-步骤-结论-误差'\n- 勤画光路图\n", "src/04-物理/一页纸清单-下学期.md": "# 物理 · 一页纸清单（下学期）\n\n> 八下（苏科版）。力学核心章，受力分析是建模起点。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 物质的物理属性 | 密度/硬度/导电性 |\n| 力 | 重力/弹力/摩擦力 |\n| 力与运动 | 牛顿第一/二力平衡 |\n| 压强 | 固体/液体压强 |\n| 浮力 | 阿基米德原理 |\n| 简单机械和功 | 杠杆/滑轮/功 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 重力 | G=mg，g=9.8，方向竖直向下 | 方向画成'垂直' |\n| 二力平衡 | 同体/等大/反向/共线 | 与相互作用力混 |\n| 牛顿第一定律 | 惯性；不受力保持原运动状态 | 误以为力是运动原因 |\n| 压强 | p=F/S(固)；p=ρgh(液) | 固液公式混用 |\n| 浮力 | F浮=ρ液gV排 | 排开体积≠物体体积 |\n| 功与杠杆 | W=Fs；F1l1=F2l2(平衡) | 力臂画错 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 平衡力 / 相互作用力 | 平衡同体，相互作用异体 |  |\n| 固体压强 / 液体压强 | 公式不同，深度从液面算 |  |\n\n## 待补充\n\n- 受力示意图从'作用点'画起\n- 密度测量实验步骤记熟\n- 杠杆作图练准线\n", "src/04-物理/核心知识.md": "# 物理 · 核心知识卡（第一批种子，按常州初二进度）\n\n> 这是预置的真实知识，可直接复习，也随时往里补新卡片。配合 `错题本.md` 和 `一页纸清单.md` 使用。\n\n---\n\n## 知识卡 1：凸透镜成像规律\n\n**核心概念**：苏科版八上光学难点，实验必考。\n\n**关键要点**\n1. u>2f：倒立缩小实像（照相机）\n1. f<u<2f：倒立放大实像（投影仪）\n1. u<f：正立放大虚像（放大镜）\n1. u=2f 等大；u=f 不成像\n\n**易错提醒**：记混'放大/缩小''实/虚'；物距焦距关系画错。\n\n**典型例题**：蜡烛在 2 倍焦距外→ 光屏得倒立缩小像。\n\n**关联**：见 错题本.md(物理)\n\n---\n\n## 知识卡 2：运动描述与速度\n\n**核心概念**：八上开篇，v=s/t 是基础公式。\n\n**关键要点**\n1. 参照物：判断运动先看选谁做标准\n1. 速度 v=s/t，单位 m/s 或 km/h（1m/s=3.6km/h）\n1. 匀速直线：v 不变，s-t 图是过原点直线\n\n**易错提醒**：参照物选错导致运动判断反；单位不统一就代入。\n\n**典型例题**：100m 用 10s→ v=10m/s=36km/h。\n\n---\n\n## 知识卡 3：力与力的示意图\n\n**核心概念**：八下力学基础，建模从画图开始。\n\n**关键要点**\n1. 三要素：大小、方向、作用点\n1. 重力 G=mg，方向竖直向下，作用点在重心\n1. 画示意图：从作用点沿方向画带箭头线段\n\n**易错提醒**：重力方向画成'垂直'而非'竖直向下'；作用点画错。\n\n**典型例题**：画静止在桌面物体的受力：重力(下)+支持力(上)平衡。\n\n**关联**：见 压强卡\n\n---\n\n## 知识卡 4：压强 p=F/S\n\n**核心概念**：八下核心概念。\n\n**关键要点**\n1. 固体压强 p=F/S；液体压强 p=ρgh\n1. 增大压强：减小 S 或增大 F；减小压强反之\n1. 液体压强随深度增大，同一深度各方向相等\n\n**易错提醒**：固体/液体压强公式混用；'深度'从液面算起。\n\n**典型例题**：坦克宽履带→ 增大受力面积减小压强。\n\n---\n\n## 知识卡 5：二力平衡\n\n**核心概念**：判断物体状态的关键。\n\n**关键要点**\n1. 条件：同体、等大、反向、共线\n1. 平衡时合力为 0，运动状态不变\n1. 与'相互作用力'区别：相互作用力作用在不同物体\n\n**易错提醒**：把相互作用力当平衡力（作用物体不同）。\n\n**典型例题**：悬挂静止的灯：重力与拉力平衡。\n\n---\n\n## 知识卡 6：凸透镜成像规律速记图\n\n**区间示意（横轴 = 物距 u，从左往右物体远离透镜）**\n\n```svg\n<svg viewBox=\"0 0 640 220\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\" font-size=\"14\">\n  <line x1=\"40\" y1=\"120\" x2=\"600\" y2=\"120\" stroke=\"#333\" stroke-width=\"2\"/>\n  <line x1=\"320\" y1=\"55\" x2=\"320\" y2=\"185\" stroke=\"#2563eb\" stroke-width=\"3\"/>\n  <text x=\"320\" y=\"205\" fill=\"#2563eb\" text-anchor=\"middle\">透镜（光心）<\/text>\n  <line x1=\"200\" y1=\"100\" x2=\"200\" y2=\"140\" stroke=\"#dc2626\" stroke-width=\"2\"/>\n  <text x=\"200\" y=\"205\" fill=\"#dc2626\" text-anchor=\"middle\">u=f 不成像<\/text>\n  <line x1=\"120\" y1=\"100\" x2=\"120\" y2=\"140\" stroke=\"#dc2626\" stroke-width=\"2\"/>\n  <text x=\"120\" y=\"205\" fill=\"#dc2626\" text-anchor=\"middle\">u=2f 等大<\/text>\n  <rect x=\"320\" y=\"78\" width=\"280\" height=\"60\" fill=\"#dcfce7\" opacity=\"0.6\"/>\n  <text x=\"460\" y=\"113\" text-anchor=\"middle\">u &lt; f：正立放大虚像（放大镜）<\/text>\n  <rect x=\"200\" y=\"78\" width=\"120\" height=\"60\" fill=\"#dbeafe\" opacity=\"0.7\"/>\n  <text x=\"260\" y=\"113\" text-anchor=\"middle\">倒立放大实像（投影仪）<\/text>\n  <rect x=\"40\" y=\"78\" width=\"160\" height=\"60\" fill=\"#fee2e2\" opacity=\"0.5\"/>\n  <text x=\"120\" y=\"113\" text-anchor=\"middle\">倒立缩小实像（照相机）<\/text>\n<\/svg>\n```\n\n**成像规律全表**\n\n| 物距 u | 像的位置 | 像的性质 | 应用 |\n|---|---|---|---|\n| u > 2f | f < v < 2f | 倒立、缩小、实像 | 照相机 |\n| u = 2f | v = 2f | 倒立、等大、实像 | 测焦距 |\n| f < u < 2f | v > 2f | 倒立、放大、实像 | 投影仪 / 幻灯机 |\n| u = f | 不成像 | — | 平行光、粗测焦距 |\n| u < f | 同侧 | 正立、放大、虚像 | 放大镜 |\n\n**记忆口诀**：一倍焦距分虚实，二倍焦距分大小；物远像近像变小。\n\n**易错提醒**：u < f 是虚像，光屏接不到；把\"放大/缩小\"\"实/虚\"与物距区间对应错。\n\n", "src/04-物理/错题本.md": "# 物理（初二新学科） · 错题本\n\n> 复制下面的「题块」追加新题。标签用于筛选同类错因。\n\n---\n\n### 题 1\n- **日期**：\n- **来源**：（月考/作业/练习）\n- **知识点标签**：\n- **错因**：（计算错/概念错/审题错/方法错/其他）\n- **原题**：（粘贴或截图，截图放同目录 `图/` 文件夹）\n- **我的错误答案**：\n- **正确解法**：\n- **反思 / 同类题**：\n- **重做记录**：（日期-对错）\n\n---\n", "src/05-生物/README.md": "# 生物（常州版）\n\n> 教材版本：**苏教版**\n\n## 初二学习重点（按常州教学进度）\n- 八上：人体的营养、呼吸、体内物质的运输（血液循环）、消化、能量供应、生命活动的调节、免疫\n- 八下：生物的生殖、遗传与变异、进化、健康生活、生物技术、生物多样性、生态系统\n- 重「识图」：结构图与生理过程图\n\n## 与常州中考/会考的关联\n- ⭐ **八年级学年末生物合格性考试（会考）**，等级呈现，作为初中毕业和高中招生参考依据，必须合格。\n\n## 本文件夹放什么\n- `README.md`（本说明）\n- `错题本.md`（按模板录入，重中之重）\n- `一页纸清单.md`（公式/词汇/核心结论速查）\n- 知识笔记：新建 `笔记-主题.md`，用「模板/知识笔记模板」\n\n## 提分建议\n- 生物重「识图」：结构图/过程图每天看 10 分钟\n- 会考真题反复刷，错题按「识图错/概念错」分类\n- 用思维导图串「人体八大系统」关联\n", "src/05-生物/一页纸清单-上学期.md": "# 生物（生地会考） · 一页纸清单（上学期）\n\n> 八上（苏教版）。人体四大系统+调节+免疫，重识图。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 人体的营养 | 消化道+消化腺(肝最大) |\n| 呼吸 | 肺通气/肺泡气体交换 |\n| 体内物质的运输 | 血液/血管/心脏/循环 |\n| 消化和吸收 | 小肠是主要场所 |\n| 神经/激素调节 | 反射弧/激素 |\n| 免疫 | 三道防线 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 消化系统 | 消化道+消化腺(肝脏最大消化腺) | 肝/胰功能混 |\n| 血液循环 | 体循环左→全→右；肺循环右→肺→左 | 路径反；肺静脉流动脉血 |\n| 反射弧 | 感受器→传入→中枢→传出→效应器 | 五部分顺序错 |\n| 呼吸 | 肺泡与血液间扩散 | 与消化混 |\n| 免疫三道防线 | 皮肤/体液/特异性 | 特异非特异混 |\n| 激素调节 | 生长/胰岛素/甲状腺激素 | 对应疾病错 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 动脉血 / 静脉血 | 看含氧量，非血管名 |  |\n| 体循环 / 肺循环 | 路径与血液变化相反 |  |\n\n## 待补充\n\n- 心脏结构图每天看 10 分钟\n- 识图专项+会考真题\n- 错题按 识图错/概念错 分类\n", "src/05-生物/一页纸清单-下学期.md": "# 生物（生地会考） · 一页纸清单（下学期）\n\n> 八下（苏教版）。遗传变异+生态，会考冲刺核心。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 生殖 | 人/植物生殖方式 |\n| 遗传与变异 | 基因/显隐性 |\n| 生物的进化 | 自然选择 |\n| 健康地生活 | 传染病/免疫 |\n| 生物技术 | 发酵/转基因 |\n| 生物多样性与生态 | 分类/保护/食物链 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 遗传显隐性 | Aa 显、aa 隐；生殖细胞基因减半 | 显隐性判断错 |\n| 基因DNA染色体 | 基因在 DNA 上，DNA 在染色体上 | 层级乱 |\n| 变异 | 可遗传(基因)/不可遗传(环境) | 分类错 |\n| 生态系统 | 生产者/消费者/分解者+非生物 | 漏分解者或非生物 |\n| 食物链 | 生产者→…，箭头表能量流向 | 方向画反 |\n| 生物多样性 | 基因/物种/生态系统三层次 | 层次混 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 可遗传变异 / 不可遗传 | 有无遗传物质改变 |  |\n| 生产者 / 消费者 | 自养/异养 |  |\n\n## 待补充\n\n- 遗传图解天天练\n- 生态系统图一张图串完\n- 会考真题 3 轮刷\n", "src/05-生物/核心知识.md": "# 生物 · 核心知识卡（第一批种子，按常州初二进度）\n\n> 这是预置的真实知识，可直接复习，也随时往里补新卡片。配合 `错题本.md` 和 `一页纸清单.md` 使用。\n\n---\n\n## 知识卡 1：人体消化系统\n\n**核心概念**：八上开篇，结构图必背。\n\n**关键要点**\n1. 消化道：口腔→咽→食道→胃→小肠→大肠→肛门\n1. 消化腺：唾液腺/胃腺/肠腺/胰腺/肝脏(最大消化腺)\n1. 淀粉→麦芽糖→葡萄糖；蛋白质→氨基酸；脂肪→甘油+脂肪酸\n1. 小肠是消化吸收主要场所（长、皱襞绒毛增面积）\n\n**易错提醒**：肝脏 vs 胰脏功能混；'消化'与'吸收'不分。\n\n**典型例题**：淀粉起始消化部位：口腔(唾液淀粉酶)。\n\n**关联**：见 血液循环卡\n\n---\n\n## 知识卡 2：血液循环\n\n**核心概念**：体循环与肺循环，会考高频。\n\n**关键要点**\n1. 体循环：左心→主动脉→全身→上下腔静脉→右心（动脉血变静脉血）\n1. 肺循环：右心→肺动脉→肺→肺静脉→左心（静脉血变动脉血）\n1. 心脏四腔：左心动脉血，右心静脉血；瓣膜防倒流\n\n**易错提醒**：体/肺循环路径反；'动脉血'按含氧量不是按血管名。\n\n**典型例题**：肺静脉流的是动脉血（易错！）。\n\n**关联**：识图：心脏结构图每天看\n\n---\n\n## 知识卡 3：神经调节（反射弧）\n\n**核心概念**：生命活动的调节核心。\n\n**关键要点**\n1. 反射弧五部分：感受器→传入神经→神经中枢→传出神经→效应器\n1. 反射分非条件(先天)与条件(后天，如望梅止渴)\n1. 大脑皮层是高级中枢\n\n**易错提醒**：五部分顺序错；条件反射非条件混。\n\n**典型例题**：缩手反射路径：皮肤感受器→…→效应器(肌肉)。\n\n---\n\n## 知识卡 4：遗传与变异\n\n**核心概念**：八下重点，基因与显隐性。\n\n**关键要点**\n1. 基因控制性状；DNA 在染色体上\n1. 显性(A)掩盖隐性(a)；Aa 表现显性\n1. 生殖细胞基因减半（精子/卵细胞各一半）\n1. 变异分可遗传(基因/染色体)与不可遗传(环境)\n\n**易错提醒**：显隐性判断错；'基因减半'忘在生殖细胞。\n\n**典型例题**：亲代 Aa×Aa → 子代 AA:Aa:aa=1:2:1，显性:隐性=3:1。\n\n**关联**：见 生态系统卡\n\n---\n\n## 知识卡 5：生态系统\n\n**核心概念**：八下收尾，会考常考。\n\n**关键要点**\n1. 组成：生物部分(生产者/消费者/分解者)+非生物部分\n1. 食物链：生产者→初级消费者→…（箭头表能量流向）\n1. 物质循环、能量流动单向递减\n1. 生物圈是最大生态系统\n\n**易错提醒**：食物链写反方向；漏了'非生物部分'或'分解者'。\n\n**典型例题**：草→虫→蛙→蛇：能量从草流向蛇。\n\n---\n\n", "src/05-生物/错题本.md": "# 生物（生地会考科目） · 错题本\n\n> 复制下面的「题块」追加新题。标签用于筛选同类错因。\n\n---\n\n### 题 1\n- **日期**：\n- **来源**：（月考/作业/练习）\n- **知识点标签**：\n- **错因**：（计算错/概念错/审题错/方法错/其他）\n- **原题**：（粘贴或截图，截图放同目录 `图/` 文件夹）\n- **我的错误答案**：\n- **正确解法**：\n- **反思 / 同类题**：\n- **重做记录**：（日期-对错）\n\n---\n", "src/06-地理/README.md": "# 地理（常州版）\n\n> 教材版本：**人教版**\n\n## 初二学习重点（按常州教学进度）\n- 八上：中国的自然环境（地形/气候/河流）、自然资源、经济发展（交通/农业/工业）\n- 八下：中国的地理差异、四大区域（北方/南方/西北/青藏）、中国在世界中\n- 地图技能：等高线、经纬网、图表判读\n\n## 与常州中考/会考的关联\n- ⭐ **八年级学年末地理合格性考试（会考）**，等级呈现，作为毕业和招生参考依据，必须合格。\n\n## 本文件夹放什么\n- `README.md`（本说明）\n- `错题本.md`（按模板录入，重中之重）\n- `一页纸清单.md`（公式/词汇/核心结论速查）\n- 知识笔记：新建 `笔记-主题.md`，用「模板/知识笔记模板」\n\n## 提分建议\n- 地图是地理的语言：每章手绘 1 张核心图\n- 气候类型用「位置→气候→景观」三步法记忆\n- 会考专题集中突破，真题限时训练\n", "src/06-地理/一页纸清单-上学期.md": "# 地理（生地会考） · 一页纸清单（上学期）\n\n> 八上（人教版）。中国自然地理基础，地图是语言。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 地形地势 | 三级阶梯/主要山脉 |\n| 气候 | 季风气候/温度带/干湿区 |\n| 河流 | 长江/黄河 |\n| 自然资源 | 总量大人均少 |\n| 经济发展 | 交通/农业/工业 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 地势三级阶梯 | 西高东低；一二阶梯界：昆仑-祁连-横断 | 界线混 |\n| 气候 | 季风显著；秦岭-淮河=1月0℃/800mm | 漏 800mm 等降水量 |\n| 长江 | 最长，水能'宝库'+航运'黄金水道'，宜昌分界 | 与黄河混 |\n| 黄河 | 含沙量最大，'地上河'在下游 | 地上河成因错 |\n| 秦岭-淮河意义 | 南北方分界/0℃/800mm/水田旱地 | 只记一条 |\n| 农业分布 | 南稻北麦，东耕西牧 | 东西反 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 气候复杂多样 / 季风气候显著 | 两大特点并列 |  |\n| 长江 / 黄河 | 水能 vs 含沙量 |  |\n\n## 待补充\n\n- 手绘中国地形图\n- 气候类型判读图\n- 会考真题+识图\n", "src/06-地理/一页纸清单-下学期.md": "# 地理（生地会考） · 一页纸清单（下学期）\n\n> 八下（人教版）。区域地理总纲，四大区域对比。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 地理差异 | 南北/东西差异 |\n| 四大区域 | 北方/南方/西北/青藏 |\n| 省级区域 | 北京/港澳/台湾/新疆 |\n| 中国在世界中 | 发展与合作 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 四大区域 | 北方(旱/麦/温)、南方(水/稻/热)、西北(干旱)、青藏(高寒) | 特征混 |\n| 南北方差异 | 耕地/作物/屋顶坡度 | 耕地作物反 |\n| 西北地区 | 干旱，草原→荒漠，灌溉农业 | 与青藏混 |\n| 青藏地区 | 高寒，河谷农业(湟水/雅鲁) | 农业类型错 |\n| 省级之最 | 新疆最大，澳门最小，广东人口多 | 数量级错 |\n| 台湾/港澳 | 出口导向/一国两制/自由贸易 | 制度混 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 西北 / 青藏 | 干旱 vs 高寒；灌溉 vs 河谷 |  |\n| 北方 / 南方 | 旱地小麦 vs 水田水稻 |  |\n\n## 待补充\n\n- 四大区域对比表\n- 台湾港澳专项\n- 会考冲刺\n", "src/06-地理/核心知识.md": "# 地理 · 核心知识卡（第一批种子，按常州初二进度）\n\n> 这是预置的真实知识，可直接复习，也随时往里补新卡片。配合 `错题本.md` 和 `一页纸清单.md` 使用。\n\n---\n\n## 知识卡 1：中国地形地势\n\n**核心概念**：八上自然地理基础。\n\n**关键要点**\n1. 地势西高东低，三级阶梯\n1. 一级：青藏高原；二级：高原盆地；三级：平原丘陵\n1. 山脉骨架：东西向(天山-阴山等)、东北-西南(大兴安岭等)\n\n**易错提醒**：三级阶梯界线记混；地势特征写反。\n\n**典型例题**：第一级阶梯：青藏高原，平均海拔 4000m 以上。\n\n**关联**：见 气候卡\n\n---\n\n## 知识卡 2：气候与季风气候\n\n**核心概念**：八上重难点。\n\n**关键要点**\n1. 气候复杂多样+季风气候显著\n1. 温度带：热带/亚热带/暖温等；干湿：湿润/半湿润等\n1. 季风：夏(偏南,暖湿)冬(偏北,干冷)\n1. 秦岭-淮河：南北方分界线(1月0℃等温线)\n\n**易错提醒**：季风风向与性质反；秦岭-淮河意义漏'800mm 等降水量'。\n\n**典型例题**：我国降水东南多西北少，夏秋多冬春少。\n\n---\n\n## 知识卡 3：长江与黄河\n\n**核心概念**：八上河流重点。\n\n**关键要点**\n1. 长江：最长，水能'水能宝库'，航运'黄金水道'，上中游分界宜昌\n1. 黄河：含沙量最大，'地上河'在下游，治黄关键在中游水土保持\n1. 都发源于青藏高原，向东入海\n\n**易错提醒**：'地上河'成因(泥沙淤积)与河段(下游)错；长江黄河混淆。\n\n**典型例题**：黄河下游'地上河'成因：中游水土流失→下游泥沙淤积。\n\n---\n\n## 知识卡 4：四大地理区域\n\n**核心概念**：八下区域地理总纲。\n\n**关键要点**\n1. 北方：旱地、小麦、温带；南方：水田、水稻、湿热\n1. 西北：干旱，草原荒漠；青藏：高寒，河谷农业\n1. 分界线：北方/南方=秦岭-淮河；青藏=地势一二级阶梯\n\n**易错提醒**：南北方耕地/作物反；西北与青藏特征混。\n\n**典型例题**：南方屋顶坡度大(降水多)；西北平顶(少雨)。\n\n---\n\n## 知识卡 5：行政区划\n\n**核心概念**：基础但常考。\n\n**关键要点**\n1. 34 个省级：23 省+5 自治区+4 直辖市+2 特区\n1. 常考：黑吉辽、京津冀、苏浙沪、粤桂、川渝、陕甘\n1. 省会+轮廓+位置三对应\n\n**易错提醒**：数量(34)记错；省会与省对应错。\n\n**典型例题**：江苏省会南京；简称苏。\n\n---\n\n", "src/06-地理/错题本.md": "# 地理（生地会考科目） · 错题本\n\n> 复制下面的「题块」追加新题。标签用于筛选同类错因。\n\n---\n\n### 题 1\n- **日期**：\n- **来源**：（月考/作业/练习）\n- **知识点标签**：\n- **错因**：（计算错/概念错/审题错/方法错/其他）\n- **原题**：（粘贴或截图，截图放同目录 `图/` 文件夹）\n- **我的错误答案**：\n- **正确解法**：\n- **反思 / 同类题**：\n- **重做记录**：（日期-对错）\n\n---\n", "src/07-历史/README.md": "# 历史（常州版）\n\n> 教材版本：**人教版（部编版）**\n\n## 初二学习重点（按常州教学进度）\n- 八上：中国开始沦为半殖民地半封建社会 → 辛亥革命 → 新民主主义革命的开始 → 从九一八到西安事变\n- 八下：中华人民共和国成立、社会主义制度建立、中国特色社会主义道路、民族团结、国防外交\n- 时间轴 + 因果链是核心方法\n\n## 与常州中考/会考的关联\n- 历史 50 分（中考，与道法合卷**开卷**）→ 开卷也要建索引，考场上 30 秒定位。\n\n## 本文件夹放什么\n- `README.md`（本说明）\n- `错题本.md`（按模板录入，重中之重）\n- `一页纸清单.md`（公式/词汇/核心结论速查）\n- 知识笔记：新建 `笔记-主题.md`，用「模板/知识笔记模板」\n\n## 提分建议\n- 画「时间轴」串大事件，避免年代混乱\n- 每课总结「背景-事件-影响」三栏\n- 材料题训练「论从史出」的答题规范\n", "src/07-历史/一页纸清单-上学期.md": "# 历史 · 一页纸清单（上学期）\n\n> 八上（人教版·部编版）。中国半殖民地半封建社会的开端到新民主主义。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 鸦片战争→第二次鸦片 | 开始沦为半殖民地 |\n| 洋务运动→甲午 | 近代化开端 |\n| 戊戌变法→辛亥革命 | 制度变革 |\n| 新文化运动→五四 | 思想解放 |\n| 中共成立→北伐 | 新民主主义革命 |\n| 南昌/井冈山→九一八→西安 | 武装斗争与转折 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 鸦片战争 | 《南京条约》，开始沦为半殖民 | 写'完全沦为'(那是辛丑) |\n| 洋务运动 | 60-90s，自强求富，失败 | 与戊戌变法混(阶级不同) |\n| 辛亥革命 | 1911，结束两千多年君主专制 | 写'结束封建制度' |\n| 新文化运动 | 民主与科学，启封建思想 | 与五四混 |\n| 五四运动 | 1919，新民主主义革命开端 | 时间错 |\n| 中共成立 | 1921，上海→嘉兴 | 地点错 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 开始沦为 / 完全沦为 | 鸦片(开始)/辛丑(完全) |  |\n| 洋务运动 / 戊戌变法 | 地主自救/资产阶级改良 |  |\n\n## 待补充\n\n- 画时间轴串大事件\n- 每课 背景-事件-影响 三栏\n- 材料题'论从史出'\n", "src/07-历史/一页纸清单-下学期.md": "# 历史 · 一页纸清单（下学期）\n\n> 八下（人教版·部编版）。新中国史与中国特色社会主义道路。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 新中国成立 | 1949.10.1 |\n| 巩固政权 | 抗美援朝/土地改革 |\n| 一五计划/三大改造 | 社会主义制度建立 |\n| 十一届三中全会 | 1978 改革开放 |\n| 祖国统一/外交/科技 |  |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 新中国成立 | 1949.10.1，半殖民结束 | 与 1978 混 |\n| 三大改造 | 1956，公有制确立，制度建立 | 与一五混 |\n| 十一届三中全会 | 1978，工作重心转经济，改革开放 | 与文革结束(1976)混 |\n| 改革开放 | 农村家庭联产/城市国企/特区 | 内容错位 |\n| 港澳回归 | 一国两制，港1997/澳1999 | 年份错 |\n| 外交 | 和平共处五项/重返联合国1971 | 事件错 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 1949 成立 / 1978 改革 | 两个里程碑 |  |\n| 一五计划 / 三大改造 | 工业化/所有制改造 |  |\n\n## 待补充\n\n- 改革开放意义背熟\n- 统一与外交专题\n- 开卷建索引 30 秒定位\n", "src/07-历史/核心知识.md": "# 历史 · 核心知识卡（第一批种子，按常州初二进度）\n\n> 这是预置的真实知识，可直接复习，也随时往里补新卡片。配合 `错题本.md` 和 `一页纸清单.md` 使用。\n\n---\n\n## 知识卡 1：鸦片战争\n\n**核心概念**：中国开始沦为半殖民地半封建社会的起点。\n\n**关键要点**\n1. 背景：英国鸦片走私；林则徐虎门销烟\n1. 条约：《南京条约》割香港岛、开五口、赔银\n1. 影响：社会性质变化，开始沦为半殖民半封建\n\n**易错提醒**：把'开始沦为'写成'完全沦为'(那是《辛丑条约》)；条约内容混。\n\n**典型例题**：《南京条约》是中国近代第一个不平等条约。\n\n**关联**：见 洋务运动卡\n\n---\n\n## 知识卡 2：洋务运动\n\n**核心概念**：近代化开端。\n\n**关键要点**\n1. 时间：19 世纪 60-90 年代；口号'自强''求富'\n1. 内容：军事工业(江南制造局)、民用(轮船招商局)、新式学堂\n1. 评价：开启近代化，但未触动制度，失败\n\n**易错提醒**：性质(地主阶级自救)与戊戌变法(资产阶级)混；评价片面。\n\n**典型例题**：洋务运动失败标志：甲午战争北洋舰队覆没。\n\n---\n\n## 知识卡 3：辛亥革命\n\n**核心概念**：推翻帝制。\n\n**关键要点**\n1. 领导：孙中山；组织：同盟会\n1. 意义：结束两千多年君主专制，建民国\n1. 局限：未完成反帝反封任务\n\n**易错提醒**：把'结束君主专制'写成'结束封建制度'；意义局限不分。\n\n**典型例题**：1911 武昌起义→ 1912 中华民国成立。\n\n---\n\n## 知识卡 4：新中国成立\n\n**核心概念**：八下开篇。\n\n**关键要点**\n1. 1949.10.1 开国大典\n1. 意义：人民当家作主；半殖民地半封建结束\n1. 巩固：西藏和平解放、抗美援朝、土地改革\n\n**易错提醒**：时间点(1949)与改革开放(1978)混；意义写不全。\n\n**典型例题**：1949 新中国成立，标志新民主主义革命基本胜利。\n\n**关联**：见 改革开放卡\n\n---\n\n## 知识卡 5：改革开放\n\n**核心概念**：中国特色社会主义道路起点。\n\n**关键要点**\n1. 1978 十一届三中全会：工作重心转经济建设，改革开放\n1. 农村：家庭联产承包责任制；城市：国企改革\n1. 特区：深圳等；格局：全方位多层次宽领域\n\n**易错提醒**：十一届三中全会时间(1978)与文革结束(1976)混；内容错位。\n\n**典型例题**：1978 年确立改革开放方针。\n\n---\n\n", "src/07-历史/错题本.md": "# 历史 · 错题本\n\n> 复制下面的「题块」追加新题。标签用于筛选同类错因。\n\n---\n\n### 题 1\n- **日期**：\n- **来源**：（月考/作业/练习）\n- **知识点标签**：\n- **错因**：（计算错/概念错/审题错/方法错/其他）\n- **原题**：（粘贴或截图，截图放同目录 `图/` 文件夹）\n- **我的错误答案**：\n- **正确解法**：\n- **反思 / 同类题**：\n- **重做记录**：（日期-对错）\n\n---\n", "src/08-道法/README.md": "# 道德与法治（常州版）\n\n> 教材版本：**人教版（部编版）**\n\n## 初二学习重点（按常州教学进度）\n- 八上：走进社会生活、遵守社会规则、勇担社会责任、维护国家利益\n- 八下：坚持宪法至上、理解权利义务、人民当家作主、崇尚法治精神\n- 重「关键词 + 案例」对应\n\n## 与常州中考/会考的关联\n- 道法 50 分（中考，与历史合卷**开卷**）→ 开卷考试，资料整理比死记重要。\n\n## 本文件夹放什么\n- `README.md`（本说明）\n- `错题本.md`（按模板录入，重中之重）\n- `一页纸清单.md`（公式/词汇/核心结论速查）\n- 知识笔记：新建 `笔记-主题.md`，用「模板/知识笔记模板」\n\n## 提分建议\n- 道法重「关键词 + 案例」对应\n- 建索引，考场上 30 秒定位知识点\n- 关注时事与教材知识点的结合\n", "src/08-道法/一页纸清单-上学期.md": "# 道德与法治 · 一页纸清单（上学期）\n\n> 八上（人教版·部编版）。社会生活与规则，重关键词+案例。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 走进社会生活 | 个人与社会 |\n| 网络生活 | 利弊/合理利用 |\n| 社会规则 | 道德/纪律/法律 |\n| 尊重/以礼/诚信 |  |\n| 责任 | 角色与责任 |\n| 国家利益 | 国家安全 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 个人与社会 | 社会化，每人是社会一员 | 割裂个人与社会 |\n| 网络利弊 | 利：便利；弊：沉迷/诈骗 | 只论一面 |\n| 社会规则 | 道德/纪律/法律(最强制) | 强制力混 |\n| 诚信 | 价值准则，民法原则 | 与法律混 |\n| 责任 | 角色→责任；代价与回报 | 只讲权利 |\n| 国家安全 | 总体国家安全观，人民为宗旨 | 与利益对立 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 道德 / 法律 | 法律最强制 |  |\n| 自由 / 规则 | 规则保障自由 |  |\n\n## 待补充\n\n- 关键词+案例本\n- 开卷建索引\n- 时事+教材点链接\n", "src/08-道法/一页纸清单-下学期.md": "# 道德与法治 · 一页纸清单（下学期）\n\n> 八下（人教版·部编版）。宪法专册与法治精神。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 宪法至上 | 根本法 |\n| 公民权利 | 平等/政治/人身自由/社会经济 |\n| 公民义务 | 受教育/纳税/服兵役 |\n| 人民当家作主 | 人大/制度 |\n| 法治精神 | 自由/平等/公平/正义 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 宪法 | 根本法，最高效力，修宪最严 | 与基本法律混 |\n| 公民权利 | 平等/政治/人身自由/社会经济 | 归类错 |\n| 权利义务 | 统一，不能只享不尽 | 关系写反 |\n| 人民代表大会制度 | 根本政治制度 | 与基本政治混 |\n| 法治精神 | 自由平等公平正义 | 概念混 |\n| 国家机构 | 人大(权)/政府(行)/法院(司) | 职权混 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 权利 / 义务 | 统一，对立统一 |  |\n| 根本法 / 基本法律 | 效力等级不同 |  |\n\n## 待补充\n\n- 宪法专册梳理\n- 权利义务图谱\n- 开卷索引 30 秒定位\n", "src/08-道法/核心知识.md": "# 道法 · 核心知识卡（第一批种子，按常州初二进度）\n\n> 这是预置的真实知识，可直接复习，也随时往里补新卡片。配合 `错题本.md` 和 `一页纸清单.md` 使用。\n\n---\n\n## 知识卡 1：宪法是根本法\n\n**核心概念**：八下宪法专册核心。\n\n**关键要点**\n1. 宪法是根本法，具最高法律效力\n1. 内容：规定国家根本问题(制度/任务/公民基本权)\n1. 一切法律不得与宪法抵触；修宪最严格\n\n**易错提醒**：把'根本法'与'基本法律'混；效力等级不清。\n\n**典型例题**：宪法是母法，其他法律是子法。\n\n**关联**：见 权利义务卡\n\n---\n\n## 知识卡 2：公民基本权利与义务\n\n**核心概念**：宪法章节重点。\n\n**关键要点**\n1. 权利：平等权、政治权、人身自由、社会经济文化权\n1. 义务：受教育、服兵役、纳税、保守秘密\n1. 权利义务统一：不能只享权不尽义务\n\n**易错提醒**：权利与义务关系(统一)写反；具体权利归类错。\n\n**典型例题**：受教育既是权利也是义务。\n\n---\n\n## 知识卡 3：社会规则与秩序\n\n**核心概念**：八上内容，联系生活。\n\n**关键要点**\n1. 规则：道德、纪律、法律（最强制）\n1. 秩序靠规则维护；自由边界是法律\n1. 他律到自律\n\n**易错提醒**：把'法律'与'道德'强制力混淆；自由与规则对立。\n\n**典型例题**：闯红灯违法→ 规则保障自由而非限制。\n\n---\n\n## 知识卡 4：国家利益与安全\n\n**核心概念**：八上收尾，时事结合。\n\n**关键要点**\n1. 国家利益至上；国家安全是头等大事\n1. 总体国家安全观：人民安全为宗旨\n1. 维护国家安全人人有责\n\n**易错提醒**：把'国家利益'与'个人利益'对立；安全观内涵不清。\n\n**典型例题**：保守国家秘密是维护国家安全的具体行动。\n\n---\n\n", "src/08-道法/错题本.md": "# 道德与法治 · 错题本\n\n> 复制下面的「题块」追加新题。标签用于筛选同类错因。\n\n---\n\n### 题 1\n- **日期**：\n- **来源**：（月考/作业/练习）\n- **知识点标签**：\n- **错因**：（计算错/概念错/审题错/方法错/其他）\n- **原题**：（粘贴或截图，截图放同目录 `图/` 文件夹）\n- **我的错误答案**：\n- **正确解法**：\n- **反思 / 同类题**：\n- **重做记录**：（日期-对错）\n\n---\n", "src/09-体育/README.md": "# 体育（常州版）\n\n> 教材版本：**人教版（部编版）**\n\n## 初二学习重点（按常州教学进度）\n- 常州体育中考 40 分（平时成绩 + 现场测试）\n- 常见项目：耐力跑（男 1000 / 女 800 或游泳）、立定跳远、掷实心球、1 分钟跳绳、球类（篮/排/足）等\n- 具体项目以当年常州市教育局公布为准，初二起系统训练\n\n## 与常州中考/会考的关联\n- 体育 40 分直接计入 700 总分，且平时成绩占比不低 → 初二就要动起来，别临考突击。\n\n## 本文件夹放什么\n- `README.md`（本说明）\n- `错题本.md`（按模板录入，重中之重）\n- `一页纸清单.md`（公式/词汇/核心结论速查）\n- 知识笔记：新建 `笔记-主题.md`，用「模板/知识笔记模板」\n\n## 提分建议\n- 按周记录各项成绩，看到进步曲线\n- 薄弱项目单独加练\n- 记录饮食/作息对状态的影响\n", "src/09-体育/一页纸清单-上学期.md": "# 体育（中考） · 一页纸清单（上学期）\n\n> 常州体育中考 40 分（平时+现场）。初二起系统练，别临考突击。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 耐力跑(男1000/女800) | 节奏/呼吸 |\n| 立定跳远 | 四段技术 |\n| 1 分钟跳绳 | 稳定节奏 |\n| 平时成绩 | 出勤/课堂表现 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 耐力跑节奏 | 匀速为主，最后 150m 冲刺 | 起步冲太快掉速 |\n| 呼吸 | 两步一呼两步一吸，鼻吸口呼 | 呼吸紊乱 |\n| 立定跳远 | 预摆-起跳-腾空-落地 | 只靠腿不用臂 |\n| 跳绳 | 前脚掌，腕发力，稳节奏 | 全脚掌踩 |\n| 平时成绩 | 出勤+课堂表现计入中考 | 忽视平时分 |\n| 准备活动 | 动态拉伸防伤 | 不热身 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 男1000 / 女800 | 距离不同 |  |\n| 耐力跑 / 短跑 | 节奏策略不同 |  |\n\n## 待补充\n\n- 周记录各项成绩看曲线\n- 薄弱项单独加练\n- 记录作息对状态影响\n", "src/09-体育/一页纸清单-下学期.md": "# 体育（中考） · 一页纸清单（下学期）\n\n> 选考项目定型 + 中考项目冲刺，按当年市教育局标准。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 实心球 | 蹬-转-挺-挥 |\n| 球类(篮/排/足) | 选最熟练一项 |\n| 引体/仰卧(男/女) |  |\n| 中考项目冲刺 |  |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 实心球 | 蹬-转-挺-挥，全身顺序 | 只用手臂忘蹬转 |\n| 球类选考 | 选最熟练一项练 | 临时换项 |\n| 引体向上(男) | 背阔发力，控制节奏 | 靠摆浪 |\n| 仰卧起坐(女) | 腹肌，肘触膝 | 借力 |\n| 评分标准 | 以当年市教育局公布为准 | 凭旧标准估分 |\n| 考前调整 | 减量保状态防伤 | 临考突击 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 实心球 / 立定跳远 | 发力顺序都重要 |  |\n| 选考 / 必考 | 选考挑强项 |  |\n\n## 待补充\n\n- 目标分拆解到项\n- 模拟测试找节奏\n- 饮食作息稳定\n", "src/09-体育/核心知识.md": "# 体育 · 核心知识卡（第一批种子，按常州初二进度）\n\n> 这是预置的真实知识，可直接复习，也随时往里补新卡片。配合 `错题本.md` 和 `一页纸清单.md` 使用。\n\n---\n\n## 知识卡 1：耐力跑(男1000/女800)\n\n**核心概念**：常州体育中考主项之一。\n\n**关键要点**\n1. 节奏：匀速为主，最后 150m 冲刺\n1. 呼吸：两步一呼两步一吸，鼻吸口呼\n1. 平时成绩占比不低，初二起系统练\n\n**易错提醒**：起步冲太快后面掉速；呼吸紊乱。\n\n**典型例题**：目标：男 1000m 4'20 内较稳。\n\n**关联**：见 中考项目卡\n\n---\n\n## 知识卡 2：立定跳远\n\n**核心概念**：技术分四段。\n\n**关键要点**\n1. 预摆：手臂后摆缓冲\n1. 起跳：蹬地充分，臂向前上摆\n1. 腾空：收腹举腿\n1. 落地：小腿前伸，屈膝缓冲\n\n**易错提醒**：只靠腿不用臂；落地不缓冲易后坐。\n\n**典型例题**：满分参考：男 2.40m 左右(以当年为准)。\n\n---\n\n## 知识卡 3：实心球与球类\n\n**核心概念**：选考常见项。\n\n**关键要点**\n1. 实心球：蹬-转-挺-挥，全身发力顺序\n1. 球类(篮/排/足)：选最熟练的一项练\n1. 具体项目与评分以当年市教育局公布为准\n\n**易错提醒**：实心球只用手臂忘蹬转；球类临时换项。\n\n**典型例题**：发力顺序：腿→腰→臂，非单纯手臂。\n\n---\n\n", "src/09-体育/错题本.md": "# 体育（中考项目） · 错题本\n\n> 复制下面的「题块」追加新题。标签用于筛选同类错因。\n\n---\n\n### 题 1\n- **日期**：\n- **来源**：（月考/作业/练习）\n- **知识点标签**：\n- **错因**：（计算错/概念错/审题错/方法错/其他）\n- **原题**：（粘贴或截图，截图放同目录 `图/` 文件夹）\n- **我的错误答案**：\n- **正确解法**：\n- **反思 / 同类题**：\n- **重做记录**：（日期-对错）\n\n---\n", "src/10-真题试卷/README.md": "# 真题试卷与测验（常州版）\n\n> 教材版本：**人教版（部编版）**\n\n## 初二学习重点（按常州教学进度）\n- 常武地区 / 常州各校：月考、期中、期末各科试卷\n- 八年级学年末：生物、地理、信息科技会考真题\n- 中考真题（700 分制）用于高年级衔接\n\n## 与常州中考/会考的关联\n- 试卷命名建议：`科目-2026下-期中`；考后必把错题归到对应科目错题本。\n\n## 本文件夹放什么\n- `README.md`（本说明）\n- `错题本.md`（按模板录入，重中之重）\n- `一页纸清单.md`（公式/词汇/核心结论速查）\n- 知识笔记：新建 `笔记-主题.md`，用「模板/知识笔记模板」\n\n## 提分建议\n- 试卷扫描或拍照按规范命名\n- 考后必做：每道错题归档到对应科目错题本\n- 建「高频考点」统计，看出题规律\n", "src/10-真题试卷/一页纸清单-上学期.md": "# 真题试卷与测验 · 一页纸清单（上学期）\n\n> 月考/期中/期末是诊断与复盘，考后归档才是提分。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 月考 | 单元诊断 |\n| 期中 | 半程复盘 |\n| 期末 | 学期收官 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 命名规范 | 科目-2026上-期中 | 乱命名难检索 |\n| 考后必做 | 每道错题进对应科目错题本 | 只刷不归档 |\n| 错题重做 | 遮答案重做 3 遍 | 看答案假懂 |\n| 高频考点 | 统计常州出题规律 | 不总结规律 |\n| 时间分配 | 先易后难，不留白 | 卡在难题 |\n| 审题 | 圈关键词防审题错 | 急中出错 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 月考 / 期中期末 | 诊断 vs 复盘 |  |\n| 刷题 / 归档 | 归档才是提分 |  |\n\n## 待补充\n\n- 试卷扫描/拍照归档\n- 错题按科目归集\n- 薄弱科专题 1 套/周\n", "src/10-真题试卷/一页纸清单-下学期.md": "# 真题试卷与测验 · 一页纸清单（下学期）\n\n> 生地会考真题 + 中考真题衔接，限时训练模拟考场。\n\n## 本册章节速览\n\n| 章节 | 一句话重点 |\n|---|---|\n| 生地会考真题 | 生物/地理/信息科技 |\n| 中考真题(衔接) | 700 分制 |\n| 限时训练 | 模拟考场节奏 |\n\n## 核心清单\n\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 会考真题 | 生物/地理/信息科技合格性考试 | 轻视会考 |\n| 中考题型结构 | 语数英120/物100/化100/道历50/体40 | 忽视开卷整理 |\n| 限时训练 | 按考试时间模拟节奏 | 不限时假高手 |\n| 错题清零 | 会考前错题本清零 | 带病进考场 |\n| 回归教材 | 会考重基础识图 | 只刷偏题 |\n| 信息科技 | 会考三科之一，等级呈现 | 漏准备 |\n\n## 易混对比\n\n| A | B | 区分点 |\n|---|---|---|\n| 合格率 / 等级 | 会考等级呈现，须合格 |  |\n| 平时练 / 限时练 | 限时才见真水平 |  |\n\n## 待补充\n\n- 会考真题 3 轮\n- 中考真题限时刷\n- 考前节奏表\n", "src/10-真题试卷/核心知识.md": "# 真题试卷 · 核心知识卡（第一批种子，按常州初二进度）\n\n> 这是预置的真实知识，可直接复习，也随时往里补新卡片。配合 `错题本.md` 和 `一页纸清单.md` 使用。\n\n---\n\n## 知识卡 1：刷题方法(常州)\n\n**核心概念**：试卷是检验，不是收藏。\n\n**关键要点**\n1. 命名：科目-2026下-期中；扫描或拍照归档\n1. 考后必做：每道错题进对应科目错题本\n1. 建立'高频考点'统计，看常州出题规律\n1. 会考/中考真题限时训练，模拟考场\n\n**易错提醒**：只刷题不归档错题；对完答案不反思。\n\n**典型例题**：一份试卷的价值=错题重做 3 遍。\n\n**关联**：见 11-方法工具/使用方法.md\n\n---\n\n## 知识卡 2：常州中考题型结构\n\n**核心概念**：了解分值分布，分配精力。\n\n**关键要点**\n1. 语数英各 120；物 100；化 100(初三)\n1. 道法+历史各 50 合卷开卷；体育 40\n1. 数学/物理/化学不带计算器\n\n**易错提醒**：忽视开卷科目仍需整理资料；低估体育平时分。\n\n**典型例题**：初二重点：物理起跑 + 生地会考过关。\n\n**关联**：见 00-学期规划/常州中考与教材说明.md\n\n---\n\n", "src/10-真题试卷/错题本.md": "# 真题试卷与测验 · 错题本\n\n> 复制下面的「题块」追加新题。标签用于筛选同类错因。\n\n---\n\n### 题 1\n- **日期**：\n- **来源**：（月考/作业/练习）\n- **知识点标签**：\n- **错因**：（计算错/概念错/审题错/方法错/其他）\n- **原题**：（粘贴或截图，截图放同目录 `图/` 文件夹）\n- **我的错误答案**：\n- **正确解法**：\n- **反思 / 同类题**：\n- **重做记录**：（日期-对错）\n\n---\n", "src/11-方法工具/使用方法.md": "# 这个知识库怎么用（家长+孩子共读）\n\n## 每天\n- 作业/测验后，把错题按「模板/错题本模板」录入对应科目错题本。\n- 生词、公式顺手补进「一页纸清单」。\n\n## 每周\n- 用艾宾浩斯法复习清单。\n- 整理 1 篇知识笔记或 1 张知识树。\n\n## 每月 / 考前\n- 重做错题本里标记「未掌握」的题（遮住答案重做）。\n- 翻看知识树做总复盘。\n\n## 命名规范（重要）\n- 试卷：`科目-2026下-期中.pdf`\n- 笔记：`2026秋-第3章-一次函数.md`\n- 错题按科目归集，不另建散文件。\n\n## 三大纪律\n1. 错题本只增不减，做对的题打勾而非删除。\n2. 一页纸清单必须能打印速记。\n3. 宁可少而精，不要多而乱。", "src/11-方法工具/知识树画法.md": "# 怎么画知识树（让知识成网）\n\n1. **中心主题**写在中间（如「一次函数」）。\n2. **一级分支**：概念、图像、性质、应用、易错。\n3. **二级分支**：每个一级下填要点。\n4. **连线标注关系**：哪些知识点常一起考。\n\n工具：纸笔 / 思维导图软件 / 本库 Markdown 标题层级。\n\n> 期末复习时，一张知识树顶十页散笔记。", "src/11-方法工具/艾宾浩斯复习表.md": "# 艾宾浩斯遗忘曲线复习法\n\n| 学习当天 | 第1天 | 第2天 | 第4天 | 第7天 | 第15天 | 第30天 |\n|---|---|---|---|---|---|---|\n| ✅ | 复习 | 复习 | 复习 | 复习 | 复习 | 复习 |\n\n**用法**：\n- 单词、古诗文、公式用此法循环复习。\n- 每次复习打勾；连续 3 次全对可移出循环。\n- 配合「一页纸清单」做速记卡效果最佳。", "src/11-方法工具/费曼学习法.md": "# 费曼学习法（检验是否真懂）\n\n1. **选概念**：挑一个刚学的知识点。\n2. **讲出来**：假装教给一个不懂的人，用大白话写/说出来。\n3. **卡壳回看**：哪里讲不清，就回到课本重新学。\n4. **简化类比**：用生活例子或类比讲通它。\n\n> 适用：物理概念、数学定理、生物过程。能讲清楚 = 真掌握。", "src/README.md": "# 初二（2026 秋）学习知识库 · 常州版\n\n> 按**江苏省常州市**初中教学与中考政策定制。核心：错题沉淀 + 知识成网 + 可检索。\n\n## 先读这两份\n- [常州中考与教材说明](00-学期规划/常州中考与教材说明.md)（教材版本 + 700 分结构 + 生地会考）\n- [使用方法](11-方法工具/使用方法.md)\n\n## 目录导航\n- [语文](01-语文/README.md)\n- [数学](02-数学/README.md)\n- [英语](03-英语/README.md)\n- [物理（初二新学科）](04-物理/README.md)\n- [生物](05-生物/README.md)\n- [地理](06-地理/README.md)\n- [历史](07-历史/README.md)\n- [道德与法治](08-道法/README.md)\n- [体育](09-体育/README.md)\n- [真题试卷与测验](10-真题试卷/README.md)\n- [学期规划](00-学期规划/学期目标.md)\n- [方法工具](11-方法工具/使用方法.md)\n- [通用模板](模板/错题本模板.md)\n\n## 每个学科已预置「核心知识.md」\n> 10 个学科都灌入了**第一批真实知识卡**（按常州初二进度，含易错提醒与例题），可直接复习，也随时往里补新卡片。配合 `错题本.md` 和 `一页纸清单.md` 使用。\n\n## 初二关键提醒（常州）\n- **物理**新学科（苏科版），重实验与建模，起跑别掉队。\n- **生地会考**（生物/地理/信息科技）在初二下学期末，合格性考试、等级呈现，须合格。\n- **错题本**是灵魂，坚持每天录入、考前重做。\n- 中考数学/物理/化学**不带计算器**，平时练硬算。\n", "src/模板/一页纸清单模板.md": "# 一页纸清单模板\n\n> 每科一份，打印随身携带。\n\n## 必背清单\n| 项目 | 内容 | 易错提醒 |\n|---|---|---|\n| 公式/词汇/结论 | | |\n\n## 易混对比\n| A | B | 区分点 |\n|---|---|---|\n| | | |\n", "src/模板/知识笔记模板.md": "# 知识笔记模板\n\n- **主题**：\n- **核心概念**：\n- **要点**：\n  1. \n  2. \n- **典型例题**：\n- **易错提醒**：\n- **关联知识**：（链接到其他章节）\n- **我的疑问**：\n", "src/模板/错题本模板.md": "# 错题本模板（通用，复制使用）\n\n### 题 N\n- **日期**：YYYY-MM-DD\n- **科目**：\n- **来源**：（月考/作业/练习）\n- **知识点标签**：（如：一次函数-图像）\n- **错因分类**：（计算错 / 概念错 / 审题错 / 方法错 / 其他）\n- **原题**：（粘贴文字或放截图，截图命名 `图/科目-日期-题号.png`）\n- **我的错误答案**：\n- **正确解法 / 步骤**：\n- **错在哪 + 怎么避免**：\n- **同类变式题**：\n- **重做记录**：（第一次 YYYY-MM-DD 对/错；第二次 …）\n\n---\n"};

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){ s=esc(s); s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); s=s.replace(/\*(.+?)\*/g,'<em>$1</em>'); s=s.replace(/`([^`]+?)`/g,'<code>$1</code>'); return s; }
function toPlain(h){ return h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(); }
function parseTable(rows){ let t='<table>';
  rows.forEach((r,idx)=>{ if(idx===1 && /^\s*\|?[\s:\-|]+\|?\s*$/.test(r) && r.indexOf('-')>=0) return;
    let cells=r.split('|'); cells=cells.slice(1, cells.length-1).map(c=>c.trim());
    const tag=idx===0?'th':'td'; t+='<tr>'+cells.map(c=>'<'+tag+'>'+inline(c)+'</'+tag+'>').join('')+'</tr>'; });
  return t+'</table>'; }
function md2html(md){
  const lines=md.replace(/\r\n/g,'\n').split('\n'); let html='', i=0;
  while(i<lines.length){ const line=lines[i];
    if(line.startsWith('```')){ const fence=line.slice(3).trim().toLowerCase(); const code=[]; i++; while(i<lines.length && !lines[i].startsWith('```')){ code.push(lines[i]); i++; } i++; if(fence==='svg'){ html+=code.join('\n'); } else { html+='<pre><code>'+esc(code.join('\n'))+'</code></pre>'; } continue; }
    if(line.startsWith('# ')){ html+='<h1>'+inline(line.slice(2))+'</h1>'; i++; continue; }
    if(line.startsWith('## ')){ html+='<h2>'+inline(line.slice(3))+'</h2>'; i++; continue; }
    if(line.startsWith('### ')){ html+='<h3>'+inline(line.slice(4))+'</h3>'; i++; continue; }
    if(line.startsWith('#### ')){ html+='<h4>'+inline(line.slice(5))+'</h4>'; i++; continue; }
    if(line.startsWith('> ')){ html+='<blockquote>'+inline(line.slice(2))+'</blockquote>'; i++; continue; }
    if(line.startsWith('|')){ const tbl=[]; while(i<lines.length && lines[i].startsWith('|')){ tbl.push(lines[i]); i++; } html+=parseTable(tbl); continue; }
    if(/^\s*[-*] /.test(line)){ const items=[]; while(i<lines.length && /^\s*[-*] /.test(lines[i])){ items.push('<li>'+inline(lines[i].replace(/^\s*[-*] /,'')).replace(/^\d+\.\s/,'')+'</li>'); i++; } html+='<ul>'+items.join('')+'</ul>'; continue; }
    if(/^\s*\d+\. /.test(line)){ const items=[]; while(i<lines.length && /^\s*\d+\. /.test(lines[i])){ items.push('<li>'+inline(lines[i].replace(/^\s*\d+\. /,'')).replace(/^\d+\.\s/,'')+'</li>'); i++; } html+='<ol>'+items.join('')+'</ol>'; continue; }
    if(line.trim()===''){ i++; continue; }
    const para=[]; while(i<lines.length && lines[i].trim()!=='' && !lines[i].startsWith('#') && !lines[i].startsWith('|') && !lines[i].startsWith('```') && !lines[i].startsWith('> ') && !/^\s*[-*] /.test(lines[i]) && !/^\s*\d+\. /.test(lines[i])){ para.push(lines[i]); i++; }
    html+='<p>'+inline(para.join(' '))+'</p>';
  }
  return html;
}

/* ---------- load docs ---------- */
async function loadDocs(){
  const items=[]; SPEC.forEach(([g,fs])=>fs.forEach(([p,t])=>items.push({g,p,t})));
    items.forEach(it=>{ if(ALL_MD[it.p]!=null){ const md=ALL_MD[it.p]; const h=md2html(md); docMap[it.p]={title:it.t,group:it.g,html:h,text:toPlain(h)}; } });
  NAV=[]; const map={};
  SPEC.forEach(([g,fs])=>{ const its=[]; fs.forEach(([p,t])=>{ if(docMap[p]) its.push({id:p,title:t}); }); if(its.length) NAV.push({name:g,items:its}); });
  NAV.push({name:"学习闭环",items:[{id:"app:add",title:"录入错题"},{id:"app:review",title:"今日复习"},{id:"app:list",title:"全部错题"},{id:"app:dash",title:"掌握看板"},{id:"app:backup",title:"数据备份"},{id:"app:exam",title:"生地会考倒计时"}]});
  buildSidebar();
  const first=NAV.find(n=>n.name!=="学习闭环"); if(first && first.items.length) show(first.items[0].id);
  else show('app:dash');
}

/* ---------- DB ---------- */
function openDB(){ return new Promise((res,rej)=>{ const r=indexedDB.open('kb_practice',1);
  r.onupgradeneeded=e=>{ e.target.result.createObjectStore('wrongs',{keyPath:'id'}); };
  r.onsuccess=e=>{ db=e.target.result; res(db); }; r.onerror=e=>rej(e); }); }
function store(m){ return db.transaction('wrongs',m).objectStore('wrongs'); }
function getAll(){ return new Promise((res,rej)=>{ const r=store('readonly').getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r); }); }
function putO(o){ return new Promise((res,rej)=>{ const r=store('readwrite').put(o); r.onsuccess=()=>res(); r.onerror=()=>rej(r); }); }
function delO(id){ return new Promise((res,rej)=>{ const r=store('readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r); }); }

/* ---------- sidebar ---------- */
function cssId(id){ return id.replace(/[^a-zA-Z0-9_-]/g,'_'); }
function buildSidebar(){ let h='';
  NAV.forEach((g,gi)=>{ h+='<div class="group" data-g="'+gi+'">';
    h+='<div class="group-title" onclick="toggleGroup('+gi+')"><span>'+g.name+'</span><span>▾</span></div><div class="items">';
    g.items.forEach(it=>{ h+='<div class="item" id="nav-'+cssId(it.id)+'" onclick="show(\''+it.id+'\')">'+it.title+'</div>'; });
    h+='</div></div>'; });
  sidebar.innerHTML=h; }
function toggleGroup(gi){ sidebar.querySelector('.group[data-g="'+gi+'"]').classList.toggle('collapsed'); }
function markActive(id){ document.querySelectorAll('.item').forEach(e=>e.classList.remove('active')); const n=document.getElementById('nav-'+cssId(id)); if(n) n.classList.add('active'); }

/* ---------- viewer ---------- */
async function show(id){
  if(id && id.indexOf('app:')===0){ if(!pinOK){unlockFirst();return;} renderApp(id); markActive(id); closeDrawer(); return; }
  const d=docMap[id];
  if(d){ currentId=id; content.innerHTML='<div class="crumbs">'+d.group+' › '+d.title+'</div>'+d.html; window.scrollTo(0,0); markActive(id); closeDrawer(); highlight(lastQuery); return; }
      try{ const md=ALL_MD[id]; if(md!=null){ const h=md2html(md); docMap[id]={title:id,group:'',html:h,text:toPlain(h)}; content.innerHTML=h; markActive(id); } else { content.innerHTML='<p style="color:var(--muted)">未找到该内容。</p>'; } }
    catch(e){ content.innerHTML='<p style="color:var(--muted)">加载失败。</p>'; }
}
function renderApp(id){ if(id==='app:add') rAdd(); else if(id==='app:review') rReview(); else if(id==='app:list') rList(); else if(id==='app:dash') rDash(); else if(id==='app:backup') rBackup(); else if(id==='app:exam') rExam(); }
function highlight(kw){ if(!kw) return; const root=document.getElementById('content'); const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const ns=[]; while(walk.nextNode()) ns.push(walk.currentNode); const low=kw.toLowerCase(); ns.forEach(n=>{ const p=n.parentNode; if(!p||['SCRIPT','STYLE','MARK'].indexOf(p.tagName)>=0) return; const txt=n.nodeValue; const tlow=txt.toLowerCase(); let idx=tlow.indexOf(low); if(idx<0) return; const frag=document.createDocumentFragment(); let last=0; while(idx>=0){ if(idx>last) frag.appendChild(document.createTextNode(txt.slice(last,idx))); const m=document.createElement('mark'); m.textContent=txt.slice(idx,idx+kw.length); frag.appendChild(m); last=idx+kw.length; idx=tlow.indexOf(low,last); } if(last<txt.length) frag.appendChild(document.createTextNode(txt.slice(last))); p.replaceChild(frag,n); }); const m=root.querySelector('mark'); if(m) m.scrollIntoView({behavior:'smooth',block:'center'}); }
function rExam(){ const target=new Date(2027,5,20).getTime(); const days=Math.max(0,Math.ceil((target-Date.now())/86400000)); let h='<div class="app"><h2>生地会考倒计时</h2>'; h+='<div class="stat" style="margin:14px 0"><div class="n">'+days+'</div><div class="l">距生地会考约剩天数（2027年6月）</div></div>'; h+='<p class="hint">生物+地理+信息科技合格性考试，八年级学年末进行，等级呈现，作为毕业与升学参考，必须合格。</p>'; h+='<h3>生物必会识图</h3><ul><li>显微镜结构与使用</li><li>动植物细胞结构</li><li>光合作用/呼吸作用实验</li><li>血液循环（体循环/肺循环）</li><li>反射弧与神经调节</li><li>遗传显隐性判断</li><li>生态系统与食物链</li></ul>'; h+='<h3>地理必会</h3><ul><li>地图三要素（比例尺/方向/图例）</li><li>气候类型与判读</li><li>地形剖面与等高线</li><li>中国地形/气候/人口分区</li><li>世界大洲大洋</li></ul>'; h+='<p class="hint">每天刷「今日复习」+ 过这页要点，会考稳过。</p></div>'; content.innerHTML=h; }

/* ---------- search ---------- */
let lastQuery='';
function doSearch(q){ q=q.trim(); lastQuery=q;
  if(!q){ lastQuery=''; if(currentId) show(currentId); else if(NAV.length) show(NAV[0].items[0].id); return; }
  const hits=[]; Object.keys(docMap).forEach(k=>{ const d=docMap[k]; const i=d.text.toLowerCase().indexOf(q.toLowerCase());
    if(d.title.toLowerCase().indexOf(q.toLowerCase())>=0||i>=0){ let sn=i>=0?d.text.substr(Math.max(0,i-30),80):''; hits.push({k,d,sn}); } });
  let h='<h2>搜索结果：'+hits.length+' 条</h2><div class="results">';
  if(!hits.length) h+='<p style="color:var(--muted)">未找到匹配内容。</p>';
  hits.forEach(x=>{ h+='<div class="res-item" onclick="show(\''+x.k+'\')"><div class="res-group">'+x.d.group+' › '+x.d.title+'</div><div class="res-title">'+x.d.title+'</div>'+(x.sn?'<div class="res-snippet">…'+esc(x.sn)+'…</div>':'')+'</div>'; });
  content.innerHTML=h+'</div>';
}
searchInput.addEventListener('input', e=>doSearch(e.target.value));

/* ---------- app: add ---------- */
let addReason='';
function rAdd(){ addReason='';
  let subjOpts=SUBJECTS.map(s=>'<option>'+s+'</option>').join('');
  let reasonPills=REASONS.map(r=>'<span class="pill" data-r="'+r+'" onclick="pickReason(this)">'+r+'</span>').join('');
  content.innerHTML='<div class="app"><h2>录入错题</h2>'+
    '<div class="form-row"><label>学科</label><select id="aSubj">'+subjOpts+'</select></div>'+
    '<div class="form-row"><label>错因分类</label><div class="pill-row" id="aReasons">'+reasonPills+'</div></div>'+
    '<div class="form-row"><label>知识点标签</label><input id="aTag" placeholder="如：一次函数 / 凸透镜成像"></div>'+
    '<div class="form-row"><label>我的错误答案</label><textarea id="aWrong"></textarea></div>'+
    '<div class="form-row"><label>正确解法</label><textarea id="aRight"></textarea></div>'+
    '<div class="form-row"><label>反思 / 同类题</label><textarea id="aRef"></textarea></div>'+
    '<div class="form-row"><label>拍照（可选）</label><input id="aPhoto" type="file" accept="image/*" capture="environment"></div>'+
    '<div style="display:flex;gap:10px"><button class="btn" onclick="saveWrong()">保存并加入复习</button>'+
    '<button class="btn sec" onclick="show(currentId||\'app:review\')">取消</button></div>'+
    '<p class="hint">保存后题目进入间隔训练；连续做对到最高级即视为掌握。</p></div>';
}
function pickReason(el){ document.querySelectorAll('#aReasons .pill').forEach(p=>p.classList.remove('on')); el.classList.add('on'); addReason=el.dataset.r; }
function saveWrong(){ const subj=document.getElementById('aSubj').value;
  if(!addReason){ alert('请选择错因分类'); return; }
  const photoInput=document.getElementById('aPhoto');
  const finish=(photo)=>{ const o={ id:'w'+Date.now(), subject:subj, reason:addReason,
      tag:document.getElementById('aTag').value, wrong:document.getElementById('aWrong').value,
      right:document.getElementById('aRight').value, ref:document.getElementById('aRef').value,
      photo:photo||'', box:1, nextReview:dayTS(1), created:Date.now(), history:[] };
    putO(o).then(()=>{ alert('已保存！明天起会出现在「今日复习」。'); show('app:review'); }); };
  if(photoInput.files&&photoInput.files[0]){ const fr=new FileReader(); fr.onload=()=>finish(fr.result); fr.readAsDataURL(photoInput.files[0]); }
  else finish('');
}
function dayTS(offset){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+offset); return d.getTime(); }
async function rReview(){ const all=await getAll();
  const due=all.filter(o=>o.nextReview<=dayTS(0)).sort((a,b)=>a.nextReview-b.nextReview);
  let h='<div class="app"><h2>今日复习 <span class="tag box">'+due.length+' 题待复习</span></h2>';
  if(!due.length){ h+='<div class="empty">今天没有待复习的错题，去「录入错题」加点料，或尽情玩耍吧。</div></div>'; content.innerHTML=h; return; }
  due.forEach(o=>{ h+=probCard(o,true); }); h+='</div>'; content.innerHTML=h;
}
function probCard(o,w){ let tags='<span class="tag">'+o.subject+'</span>';
  if(o.tag) tags+='<span class="tag">'+esc(o.tag)+'</span>';
  tags+='<span class="tag reason">'+o.reason+'</span><span class="tag box">第'+o.box+'级</span>';
  let photo=o.photo?'<img src="'+o.photo+'">':'';
  let actions=w?('<div style="display:flex;gap:10px;margin-top:10px"><button class="btn" onclick="grade(\''+o.id+'\',true)">做对了 ✓</button><button class="btn danger" onclick="grade(\''+o.id+'\',false)">还不会 ✗</button><button class="btn sec" onclick="delWrong(\''+o.id+'\')">删除</button></div>'):'';
  return '<div class="prob" id="p-'+o.id+'"><div class="meta">'+tags+'</div>'+
    '<div class="q">我的错误：</div><div class="a">'+esc(o.wrong||'（无）')+'</div>'+
    '<div class="q">正确解法：</div><div class="a">'+esc(o.right||'（无）')+'</div>'+
    (o.ref?'<div class="q">反思：</div><div class="a">'+esc(o.ref)+'</div>':'')+photo+actions+'</div>';
}
async function grade(id,ok){ const all=await getAll(); const o=all.find(x=>x.id===id); if(!o) return;
  o.history.push({ts:Date.now(),ok:ok});
  if(ok){ o.box=Math.min(o.box+1,INTERVALS.length); o.nextReview=dayTS(INTERVALS[o.box-1]); if(o.box===INTERVALS.length) o.mastered=true; }
  else { o.box=1; o.nextReview=dayTS(1); o.mastered=false; }
  putO(o).then(()=>{ if(ok) setTimeout(()=>rReview(),250); else rReview(); });
}
async function delWrong(id){ if(!confirm('确定删除这道错题？')) return; await delO(id); rReview(); }
async function rList(){ const all=await getAll();
  let h='<div class="app"><h2>全部错题 <span class="tag box">'+all.length+' 题</span></h2>';
  if(!all.length){ h+='<div class="empty">还没有错题。点右下角 ＋ 或「录入错题」开始积累。</div></div>'; content.innerHTML=h; return; }
  all.sort((a,b)=>b.created-a.created).forEach(o=>{ h+=probCard(o,false); }); h+='</div>'; content.innerHTML=h; }
async function rDash(){ const all=await getAll(); const today=dayTS(0);
  const total=all.length; const mastered=all.filter(o=>o.box>=INTERVALS.length).length;
  const due=all.filter(o=>o.nextReview<=today).length;
  let bySubj={}; SUBJECTS.forEach(s=>bySubj[s]=0); all.forEach(o=>{ bySubj[o.subject]=(bySubj[o.subject]||0)+1; });
  let byReason={}; REASONS.forEach(r=>byReason[r]=0); all.forEach(o=>{ byReason[o.reason]=(byReason[o.reason]||0)+1; });
  const maxS=Math.max(1,...Object.values(bySubj)); const maxR=Math.max(1,...Object.values(byReason));
  let h='<div class="app"><h2>掌握看板</h2><div class="grid">'+stat(total,'错题总数')+stat(mastered,'已掌握')+stat(due,'今日待复习')+stat(total-mastered,'攻克中')+'</div>';
  h+='<h3>各学科学错题数</h3>'; Object.keys(bySubj).forEach(s=>{ if(bySubj[s]>0) h+=bar(s,bySubj[s],maxS); });
  h+='<h3>错因分布（家长重点看）</h3>'; REASONS.forEach(r=>{ if(byReason[r]>0) h+=bar(r,byReason[r],maxR); });
  h+='<p class="hint">错因多为「计算错」→ 练草稿规范；「概念错」多 → 回头补核心知识卡。</p></div>';
  content.innerHTML=h;
}
function stat(n,l){ return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
function bar(name,v,max){ return '<div class="bar"><div class="name">'+name+'</div><div class="track"><div class="fill" style="width:'+(v/max*100)+'%"></div></div><div class="val">'+v+'</div></div>'; }
function rBackup(){ content.innerHTML='<div class="app"><h2>数据备份</h2>'+
  '<p class="hint">错题数据只存在本机浏览器。换手机/清缓存前请导出；可在另一台设备导入恢复。</p>'+
  '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="btn" onclick="exportData()">导出 JSON</button>'+
  '<label class="btn sec">导入 JSON<input id="impFile" type="file" accept="application/json" style="display:none" onchange="importData(this)"></label></div>'+
  '<h3 style="margin-top:20px">访问密码</h3><div style="display:flex;gap:10px;flex-wrap:wrap">'+
  '<input id="newPin" type="password" inputmode="numeric" maxlength="8" placeholder="新密码" style="width:140px;padding:9px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text)">'+
  '<button class="btn" onclick="changePin()">修改密码</button></div>'+
  '<p class="hint">提示：本密码仅防随手打开，不是银行级加密，链接请勿外传。</p></div>';
}
function exportData(){ getAll().then(all=>{ const blob=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='错题备份_'+new Date().toISOString().slice(0,10)+'.json'; a.click(); }); }
function importData(el){ const f=el.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const arr=JSON.parse(rd.result); let n=0; arr.forEach(o=>putO(o).then(()=>{ if(++n===arr.length){ alert('导入完成：'+arr.length+' 题'); rDash(); } })); }
    catch(e){ alert('文件格式错误'); } }; rd.readAsText(f); }
function changePin(){ const v=document.getElementById('newPin').value.trim(); if(!/^\d{4,8}$/.test(v)){ alert('密码需为 4-8 位数字'); return; } localStorage.setItem('kb-pin',v); alert('密码已修改'); }

/* ---------- PIN ---------- */
function unlockFirst(){ alert('请先输入密码解锁'); document.getElementById('pinInput').focus(); }
function initPin(){ const has=localStorage.getItem('kb-pin');
  document.getElementById('pinDesc').textContent=has?'输入访问密码以进入':'首次使用，请设置 4-8 位数字密码';
  document.getElementById('pinTitle').textContent=has?'知识库已上锁':'设置访问密码';
  document.getElementById('pinOk').onclick=()=>{ const v=document.getElementById('pinInput').value.trim();
    if(!has){ if(!/^\d{4,8}$/.test(v)){ document.getElementById('pinErr').textContent='密码需为 4-8 位数字'; return; } localStorage.setItem('kb-pin',v); enter(); }
    else { if(v!==localStorage.getItem('kb-pin')){ document.getElementById('pinErr').textContent='密码错误'; return; } enter(); } };
  document.getElementById('pinInput').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('pinOk').click(); });
}
function enter(){ pinOK=true; document.getElementById('pinGate').style.display='none'; document.getElementById('fab').style.display='block';
  openDB().then(()=>{}).catch(()=>{}); }
document.getElementById('fab').onclick=()=>{ if(!pinOK){unlockFirst();return;} show('app:add'); };

/* ---------- theme / drawer ---------- */
const themeBtn=document.getElementById('themeBtn');
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t); themeBtn.textContent=t==='dark'?'☀️':'🌙'; try{localStorage.setItem('kb-theme',t);}catch(e){} }
themeBtn.addEventListener('click', ()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
(function(){ let t='light'; try{t=localStorage.getItem('kb-theme')||'light';}catch(e){} applyTheme(t); })();
document.getElementById('hamburger').addEventListener('click', ()=>{ sidebar.classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); });
document.getElementById('overlay').addEventListener('click', closeDrawer);
function closeDrawer(){ sidebar.classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
enter();
loadDocs();
/* PWA service worker disabled for public deploy */
