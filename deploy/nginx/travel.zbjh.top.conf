# 旅行规划智能体子站点  travel.zbjh.top
# 放到服务器 /etc/nginx/conf.d/ 下，然后 nginx -t && systemctl reload nginx
# 反代到本机 3100 端口的 Next standalone

# 限流 zone：按客户端 IP，每秒 10 次、突发 20 次——只拦脚本级洪水（真·DoS），正常连点不受影响
limit_req_zone $binary_remote_addr zone=taplan:10m rate=10r/s;

server {
    server_name travel.zbjh.top;

    client_max_body_size 10m;

    # 规划接口：仅防脚本级洪水（真·DoS），正常连点不受影响；
    # 真正的「每日试用次数上限」在应用层用 cookie 身份 + 配额做（AI 5 次/天、规则 50 次/天）
    location /api/plan {
        limit_req zone=taplan burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }


    # 静态资源：由 nginx 直接 serve 源 build 的 .next/static（带 contenthash，可长期缓存）
    # 注意：Next standalone 的 server.js 不自带 .next/static，必须由 web 服务器直接提供
    location /_next/static/ {
        alias /opt/travel-agent/.next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 页面文档（HTML）：禁止缓存，每次取最新，避免旧 HTML 引用已删除的旧 chunk
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/travel.zbjh.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/travel.zbjh.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# 80 -> 443 跳转（certbot 管理）
server {
    if ($host = travel.zbjh.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name travel.zbjh.top;
    return 404; # managed by Certbot
}
